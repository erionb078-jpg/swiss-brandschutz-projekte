<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TILAVA · تلاوة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: young, warm, clear for parents — a school you can trust at a glance
   IDEA: an open book whose curved pages (lavender over lime) run through every section
   PICTURE: large illustrated open book with تلاوة, page curves and waves on the plum hero
   COLOUR and TYPE: plum #2A203B, cream #F8F3EA, lavender #C6B5FF cards, lime #D7EF91 actions; DM Sans + Noto Naskh Arabic
   LAYOUT: plum hero band, wave into cream; cards in wrapping grids; forms one calm column */
:root{color-scheme:light dark;--plum:#2A203B;--lav:#C6B5FF;--cream:#F8F3EA;--lime:#D7EF91;
--bg:light-dark(#F8F3EA,#1b1426);--ink:light-dark(#2A203B,#F3EDE2);--card:light-dark(#fffdf8,#261d34);
--line:light-dark(rgba(42,32,59,.13),rgba(255,255,255,.13));--mute:light-dark(#6b6177,#b9afc6);--soft:light-dark(#efe8db,#2e2440)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.ar{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.wrap{max-width:1240px;margin:0 auto}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
h1,h2,h3{line-height:1.08;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(34px,5.4vw,56px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(28px,3.4vw,40px);font-weight:800;letter-spacing:-.015em}
h3{font-size:20px;font-weight:700}
p{margin:0 0 1em;max-width:68ch}
.small{font-size:14px;color:var(--mute)}
/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:16px;padding:10px max(5vw,16px);max-width:1240px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:26px;letter-spacing:-.03em}
.logo svg{width:44px;height:26px}.logo .ar{font-size:17px;color:var(--mute);margin-left:2px}
nav.main{display:flex;gap:4px;margin-left:auto}.burger{margin-left:auto}
nav.main a{text-decoration:none;padding:10px 12px;border-radius:12px;font-weight:500}
nav.main a[aria-current=page]{background:var(--lav);color:var(--plum)}
nav.main a:hover{background:var(--soft)}
.lang{display:flex;background:var(--lav);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:none;font:700 14px "DM Sans",system-ui,sans-serif;color:var(--plum);padding:8px 12px;border-radius:999px;cursor:pointer;min-height:38px}
.lang button[aria-pressed=true]{background:var(--plum);color:var(--cream)}
.burger{display:none;border:0;background:var(--soft);color:var(--ink);width:44px;height:44px;border-radius:12px;cursor:pointer}
@media(max-width:1000px){nav.main{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);padding:8px max(5vw,16px) 16px;border-bottom:1px solid var(--line)}
nav.main.open{display:flex}.burger{display:grid;place-items:center}nav.main a{padding:14px}}
.demo{background:var(--lime);color:var(--plum);font-size:14px;text-align:center;padding:7px 16px;font-weight:500}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;border:2px solid transparent;font:700 16px "DM Sans",system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.lime{background:var(--lime);color:var(--plum)}
.ghost{border-color:currentColor;background:none;color:inherit}
.plumb{background:var(--plum);color:var(--cream)}
:root[data-theme=dark] .plumb{background:var(--lav);color:var(--plum)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .plumb{background:var(--lav);color:var(--plum)}}
.btn.sm{min-height:44px;padding:9px 16px;font-size:15px}
:focus-visible{outline:3px solid #8d74f0;outline-offset:2px}
/* hero */
.hero{background:var(--plum);color:var(--cream);position:relative;padding-bottom:clamp(70px,9vw,120px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.tag{display:inline-flex;gap:10px;align-items:center;font-weight:500;color:var(--lav);margin-bottom:18px}
.tag .ar{font-size:22px;color:var(--lime)}
.hero p.lead{font-size:clamp(17px,1.8vw,20px);color:#e8e0f5}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.hero .fig{aspect-ratio:13/10;width:100%}
.hero .fig svg{width:100%;height:100%;display:block}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:clamp(50px,7vw,96px);width:100%;display:block}
@media(prefers-reduced-motion:no-preference){.float{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}}
@media(max-width:720px){.hero .wrap{grid-template-columns:1fr}.hero .fig{order:2;max-width:460px;justify-self:center}}
/* cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.course{background:var(--lav);color:var(--plum);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;text-decoration:none;border:0;text-align:left;font:inherit;cursor:pointer;position:relative;overflow:hidden}
.course:nth-child(3n+2){background:var(--lime)}
.course .ic{width:52px;height:52px;border-radius:16px;background:var(--plum);color:var(--cream);display:grid;place-items:center;font-size:26px}
.course h3{margin:0}.course p{margin:0;font-size:15px}
.course .go{margin-top:auto;font-weight:700;font-size:15px}
.course::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:70px;border-top:3px solid rgba(42,32,59,.18);border-radius:50% 50% 0 0}
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px}
.step b.n{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--plum);color:var(--lime);font-size:18px;margin-bottom:12px}
:root[data-theme=dark] .step b.n{background:var(--lav);color:var(--plum)}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:start}
.tcard h3{margin:2px 0 4px}
.tcard .meta{font-size:14px;color:var(--mute);margin:0 0 4px}
.tcard .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.av{width:96px;aspect-ratio:1;border-radius:20px;display:grid;place-items:center;position:relative;overflow:hidden;color:var(--plum);font-weight:800;font-size:30px}
.av svg{position:absolute;inset:0;width:100%;height:100%}.av span{position:relative}
.av small{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;font-weight:500;opacity:.75}
.pill{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--soft);margin:0 4px 4px 0}
.pill.l{background:var(--lav);color:var(--plum)}.pill.g{background:var(--lime);color:var(--plum)}
.samp{font-size:13px;color:#7a62e0;font-weight:500}
.price{font-weight:700;white-space:nowrap}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px}
.parents{background:var(--plum);color:var(--cream);border-radius:28px;padding:clamp(22px,3vw,36px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.parents svg{width:72px;height:72px}
@media(max-width:560px){.parents{grid-template-columns:1fr}}
/* filters */
.filters{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
select,input,textarea{font:16px "DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;min-height:46px;width:100%}
textarea{min-height:96px;resize:vertical}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.tlist{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.empty{padding:40px 20px;text-align:center;border:2px dashed var(--line);border-radius:24px}
/* profile */
.prof{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(20px,4vw,48px);align-items:start}
.prof .av{width:100%;max-width:300px;font-size:72px;border-radius:32px}
.prof .av small{font-size:13px;bottom:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
.box h3{font-size:17px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:8px 16px;margin:0}
.kv dt{color:var(--mute);font-size:15px}.kv dd{margin:0}
@media(max-width:720px){.prof{grid-template-columns:1fr}.prof .av{max-width:180px}.kv{grid-template-columns:1fr}.kv dd{margin-bottom:8px}}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:8px 12px;min-height:44px;font:500 15px "DM Sans",system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.slot[aria-pressed=true]{background:var(--lime);border-color:var(--plum);color:var(--plum)}
.note{font-size:14px;background:var(--soft);border-radius:14px;padding:10px 14px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;font-weight:500;margin-bottom:8px}
/* form */
form.bk{max-width:720px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,28px);margin-bottom:16px;display:grid;gap:14px}
.sec h3{margin:0}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.err{color:#c0392b;font-size:14px;font-weight:500}
:root[data-theme=dark] .err{color:#ff8f80}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--plum)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.ok{background:var(--plum);color:var(--cream);border-radius:28px;padding:clamp(24px,4vw,40px);max-width:720px}
.ok .ic{width:64px;height:64px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin-bottom:16px}
.ok dl{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:6px 14px;margin:16px 0}.ok dt{color:var(--lav)}.ok dd{margin:0}
.flag{border-radius:14px;padding:10px 14px;font-size:15px;margin:12px 0;background:var(--lime);color:var(--plum)}
/* team */
.req{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;display:grid;gap:8px}
.st{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft)}
.st.open{background:var(--lav);color:var(--plum)}.st.confirmed{background:var(--lime);color:var(--plum)}.st.declined{background:#f3c9c2;color:#5b1d14}.st.alt{background:#ffe3a8;color:#4b3500}
.racts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.racts input{width:auto;min-height:44px}
.suras{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:8px 0 16px;scrollbar-width:thin}
.sura{flex:none;display:grid;grid-template-columns:auto auto;gap:0 8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:8px 14px;min-height:52px;font:500 15px "DM Sans",system-ui,sans-serif;cursor:pointer}
.sura b{grid-row:span 2;font-size:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}.sura .ar{font-size:15px;color:var(--mute)}
.sura[aria-selected=true]{background:var(--plum);color:var(--cream);border-color:var(--plum)}.sura[aria-selected=true] b{background:var(--lime);color:var(--plum)}.sura[aria-selected=true] .ar{color:var(--lav)}
.reader{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(16px,3vw,28px);display:grid;gap:14px}
.rhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center}.toggles{display:flex;flex-wrap:wrap;gap:4px 20px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:12px;height:12px;border-radius:50%;background:currentColor;display:inline-block}
.mushaf{background:#fffdf8;color:#2A203B;border-radius:22px;padding:clamp(12px,2.5vw,24px);border:1px solid rgba(42,32,59,.1);background-image:linear-gradient(90deg,rgba(198,181,255,.25),transparent 8%,transparent 92%,rgba(215,239,145,.3))}
.mushaf .ar,.basm{direction:rtl;text-align:right;font-size:clamp(25px,3.6vw,34px);line-height:2.1;margin:0;font-weight:600}
.basm{text-align:center;margin-bottom:6px}
.ayah{padding:6px 12px;border-radius:16px;cursor:pointer;border:2px solid transparent;transition:background .2s}
.ayah:hover{background:rgba(198,181,255,.18)}.ayah.on{background:rgba(198,181,255,.35);border-color:#D7EF91}
.ayah .tr{margin:0 0 6px;font-size:15px;color:#4d4359}
.vn{color:#7a62e0;font-size:.8em}
.tj-g{color:#16924a}.tj-q{color:#1f5fd1}.tj-i{color:#c46a00}.tj-d{color:#b02f8e}.tj-m{color:#d1222a}.tj-l{color:#8f889b}
.qteaser{background:var(--plum);color:var(--cream);border-radius:28px;padding:clamp(22px,3vw,36px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center}
.qteaser p{color:#e8e0f5}.qteaser .mushaf p{color:#2A203B}.mushaf.mini .ar{font-size:clamp(24px,3vw,30px)}
@media(max-width:720px){.qteaser{grid-template-columns:1fr}}
.lu{display:block;width:100%;height:auto}
.hero .fig{position:relative}.hero .fig .luh{position:absolute;left:-2%;bottom:-4%;width:30%}
@media(prefers-reduced-motion:no-preference){.luh,.lubig{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:rotate(-4deg) translateY(-4px)}}}
.prices{display:grid;gap:16px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media(max-width:720px){.prices{grid-template-columns:1fr}}
.pcard{border-radius:28px;padding:clamp(20px,3vw,32px);position:relative;overflow:hidden}
.pcard.main{background:var(--plum);color:var(--cream)}.pcard.main li{margin-bottom:6px}.pcard.main ul{padding-left:20px;margin:0 0 18px}
.pcard .big{font-size:18px;margin:0 0 12px}.pcard .big b{font-size:clamp(40px,6vw,56px);color:var(--lime);letter-spacing:-.02em}
.pcard.free{background:var(--lime);color:var(--plum);padding-right:clamp(20px,3vw,32px)}
.pcard.free .lumini{width:96px;float:right;margin:-6px -6px 6px 10px}
.pcard.free .plumb{background:var(--plum)!important;color:var(--cream)!important}
.kteaser{background:var(--lime);color:var(--plum);border-radius:28px;padding:clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:24px;align-items:center}
.kteaser .plumb,.kidsband .plumb{background:var(--plum)!important;color:var(--cream)!important}
@media(max-width:560px){.kteaser{grid-template-columns:1fr}.kteaser .lumid{width:140px}}
.kidsband{background:var(--lime);color:var(--plum)}
.khero{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:clamp(16px,4vw,48px);align-items:center}
@media(max-width:600px){.khero{grid-template-columns:1fr}.lubig{width:180px}}
.bubble{background:#fff;color:var(--plum);border-radius:24px 24px 24px 6px;padding:16px 20px;font-size:19px;font-weight:500;max-width:52ch;box-shadow:0 6px 0 rgba(42,32,59,.12)}
.colorer{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:720px){.colorer{grid-template-columns:1fr}}
.canvas{background:#fff;border-radius:24px;border:1px solid var(--line);padding:12px;max-width:520px;width:100%}
.canvas svg{display:block;width:100%;height:auto;cursor:pointer}.canvas [data-r]{transition:fill .15s}
.tools{display:grid;gap:12px;align-content:start}
.pal{display:grid;grid-template-columns:repeat(6,44px);gap:8px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid rgba(42,32,59,.25);cursor:pointer;font-size:16px;color:var(--plum)}
.sw.on{outline:3px solid #8d74f0;outline-offset:2px;transform:scale(1.08)}
.games{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.game{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(16px,3vw,24px)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc{aspect-ratio:1;border-radius:16px;border:0;background:var(--plum);cursor:pointer;display:grid;place-items:center;font:700 16px "DM Sans",system-ui,sans-serif;color:var(--plum);min-height:56px}
.mc.up{background:var(--lav)}.mc.ok{background:var(--lime)}.mc .ar{font-size:clamp(28px,5vw,38px);line-height:1}
.qopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qo{aspect-ratio:1;border-radius:18px;border:2px solid var(--line);background:#fffdf8;color:#2A203B;cursor:pointer;min-height:64px}.qo .ar{font-size:clamp(34px,6vw,48px);line-height:1}
.qo.right{background:var(--lime);border-color:#4E9F5B}.qo.wrong{background:#f3c9c2;border-color:#c0392b}
.qname{font-size:22px;background:var(--lav);color:var(--plum);padding:2px 12px;border-radius:999px}
.qend{text-align:center}.qend .lu{width:140px;margin:0 auto}
.okLu{width:110px;float:right;margin:-10px -6px 0 12px}
.gcards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.gcard{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;align-items:center;background:var(--lav);color:var(--plum);border-radius:28px;padding:clamp(18px,3vw,26px);text-decoration:none;transition:transform .15s}
.gcard:hover{transform:translateY(-2px)}.gcard.l{background:var(--lime)}.gcard h3{margin:0 0 6px;font-size:24px}.gcard p{font-size:15px;margin:0 0 12px}
.gbig{font-size:54px;background:var(--plum);color:var(--lime);border-radius:24px;aspect-ratio:1;display:grid;place-items:center}
.gcard.l .plumb{background:var(--plum)!important;color:var(--cream)!important}
@media(max-width:460px){.gcard{grid-template-columns:72px minmax(0,1fr)}.gbig{font-size:36px}}
.prs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.pr{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;text-decoration:none;transition:transform .15s}
.pr:hover{transform:translateY(-2px)}.pr img{width:96px;height:120px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);background:#fff}
.pr h3{font-size:17px;margin:2px 0 4px}.pr p{font-size:14px;margin:0 0 6px;color:var(--mute)}.pr span{font-weight:700;font-size:14px;color:#7a62e0}

const mailOK=s=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s.trim());
function validate(){ERR={};
 if(!BK.wd)ERR.wd=t("eReq");else if(BK.wd<=iso(new Date()))ERR.wd=t("ePast");if(!BK.wt)ERR.wt=t("eReq");
 if(!BK.name.trim())ERR.name=t("eReq");
 if(BK.minor){if(!BK.pname.trim())ERR.pname=t("eReq");if(!mailOK(BK.pmail))ERR.pmail=BK.pmail?t("eMail"):t("eReq")}
 else if(!mailOK(BK.email))ERR.email=BK.email?t("eMail"):t("eReq");
 return !Object.keys(ERR).length}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),ms))])}
async function save(req){if(!db||!uid)return false;
 try{const ref=db.doc("anfragen/"+uid);const s=await withTimeout(ref.get(),10000);const items=s.exists?[...((s.data()||{}).items||[])]:[];items.push(req);
  await withTimeout(ref.set({uid,updatedAt:Date.now(),items}),10000);return true}catch(e){return false}}
async function submit(){
 if(!validate()){render();const f=document.querySelector("[aria-invalid=true]")||document.querySelector(".err");f&&f.focus&&f.focus();f&&f.scrollIntoView({block:"center"});return}
 const d=BK.wd,tm=BK.wt;
 const req={pkg:BK.pkg,id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),status:"open",createdAt:Date.now(),course:BK.course,tlang:BK.tlang,mode:BK.mode,date:d,time:tm,tz:TZ,userTz:userTZ,
  minor:BK.minor,name:BK.name.trim(),email:BK.minor?"":BK.email.trim(),pname:BK.minor?BK.pname.trim():"",pmail:BK.minor?BK.pmail.trim():"",msg:BK.msg.trim().slice(0,1000),lang};
 const b=document.getElementById("sendbtn");b.disabled=true;b.textContent=t("sending");
 const live=await save(req);SENT={...req,live};BK=null;ERR={};TEAM=null;location.hash="sent";render()}
/* ---------- team ---------- */
async function loadTeam(){TEAM=null;try{const snap=await withTimeout(db.collection("anfragen").get(),10000);const all=[];snap.docs.forEach(d=>{const v=d.data()||{};(v.items||[]).forEach(it=>all.push({...it,_u:d.id}))});
 all.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));TEAM=all}catch(e){TEAM=e&&e.code==="timeout"?"timeout":[]}if(location.hash==="#team")render()}
async function setStatus(u,id,status,alt){try{const ref=db.doc("anfragen/"+u);const s=await withTimeout(ref.get(),10000);if(!s.exists)throw 0;const v=s.data();
 const items=(v.items||[]).map(it=>it.id===id?{...it,status,alt:alt||it.alt||"",handledAt:Date.now()}:it);await withTimeout(ref.set({...v,items,updatedAt:Date.now()}),10000);TEAM=null;loadTeam()}catch(e){const el=document.querySelector(`[data-id="${id}"]`);el&&el.insertAdjacentHTML("beforeend",`<span class="err">${t("saveErr")}</span>`)}}

document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l;try{localStorage.setItem("tl-lang",lang)}catch(e){}if(Object.keys(ERR).length&&BK)validate();render()}));
const burger=document.getElementById("burger"),nav=document.getElementById("nav");
burger.addEventListener("click",()=>{const o=nav.classList.toggle("open");burger.setAttribute("aria-expanded",o)});
nav.addEventListener("click",()=>{nav.classList.remove("open");burger.setAttribute("aria-expanded","false")});
window.addEventListener("hashchange",render);
app.addEventListener("click",e=>{
 const su=e.target.closest("[data-sura]");if(su){QS.s=+su.dataset.sura;QS.a=-1;render();const b=document.querySelector(".sura[aria-selected=true]");b&&b.scrollIntoView({block:"nearest",inline:"center"});return}
 const ay=e.target.closest("[data-ay]");if(ay){const i=+ay.dataset.ay;setAyah(i);const au=document.getElementById("qa"),tt=SURAHS[QS.s].t;if(au&&tt[i]!=null){au.currentTime=tt[i];au.play().catch(()=>{})}return}
 if(e.target.closest("#qnext")){setAyah(QS.a+1);return}if(e.target.closest("#qprev")){setAyah(QS.a<0?0:QS.a-1);return}
 const fr=e.target.closest("[data-free]");if(fr){BK=null;PKG0="free";return}
 const pg=e.target.closest("[data-page]");if(pg){CP.p=+pg.dataset.page;CP.msg="";render();return}
 const sw=e.target.closest("[data-col]");if(sw){CP.c=sw.dataset.col;document.querySelectorAll(".sw").forEach(b=>{const on=b===sw;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});return}
 const rg=e.target.closest("#canvas [data-r]");if(rg){const all=[...document.querySelectorAll("#canvas [data-r]")],i=all.indexOf(rg);CP.fills[CP.p][i]=CP.c;rg.setAttribute("fill",CP.c);return}
 if(e.target.closest("#cclear")){CP.fills[CP.p]={};render();return}
 if(e.target.closest("#dlmine")){dl(false);return}if(e.target.closest("#dlblank")){dl(true);return}
 const mc=e.target.closest("[data-mc]");if(mc){const i=+mc.dataset.mc;if(MG.open.length>=2||MG.open.includes(i)||MG.done.includes(i))return;MG.open.push(i);
  if(MG.open.length===2){MG.moves++;const [a,b]=MG.open.map(j=>MG.cards[j]);if(a.l===b.l){MG.done.push(...MG.open);MG.open=[]}else setTimeout(()=>{MG.open=[];render()},900)}render();return}
 if(e.target.closest("#memnew")){newMemory();render();return}
 const qo=e.target.closest("[data-qo]");if(qo&&QZ.a===null){QZ.a=+qo.dataset.qo;if(QZ.a===QZ.q)QZ.s++;render();return}
 if(e.target.closest("#qznext")){QZ.r++;if(QZ.r<10)newQ();render();return}
 if(e.target.closest("#qznew")){QZ.r=0;QZ.s=0;newQ();render();return}
 const c=e.target.closest("[data-course]");if(c){BK=null;location.hash="book-"+c.dataset.course;return}
 if(e.target.closest("#reset,#reset2")){Object.keys(F).forEach(k=>F[k]="");render();return}
 const p=e.target.closest("[data-pre]");if(p){BK=null;PRE=p.dataset.pre;return}
 const s=e.target.closest("[data-slot]");if(s){BK.slot=s.dataset.slot;BK.wish=false;delete ERR.slot;render();return}
 const a=e.target.closest("[data-act]");if(a){const box=a.closest(".racts"),ins=box.querySelectorAll("input");let alt="";
  if(a.dataset.act==="alt"){if(!ins[0].value||!ins[1].value){ins[0].focus();return}alt=ins[0].value+" "+ins[1].value}
  a.disabled=true;setStatus(box.dataset.u,box.dataset.id,a.dataset.act,alt)}
});
app.addEventListener("change",e=>{const el=e.target;
 if(el.dataset.qt){QS[el.dataset.qt]=el.checked;render();return}
 if(el.dataset.f){F[el.dataset.f]=el.value;render();return}
 if(el.dataset.b&&BK){const k=el.dataset.b;
  if(k==="tid"){const keep=BK;BK=newBK(el.value);["pkg","name","email","pname","pmail","msg","minor"].forEach(x=>BK[x]=keep[x]);history.replaceState(null,"","#book-"+el.value);lastRoute="book-"+el.value;render();return}
  BK[k]=el.type==="checkbox"?el.checked:el.value;if(["wish","minor","mode"].includes(k)){if(k==="minor")["name","email","pname","pmail"].forEach(x=>delete ERR[x]);render()}}
});
app.addEventListener("input",e=>{const el=e.target;if(el.dataset.b&&BK&&el.type!=="checkbox"&&el.tagName!=="SELECT")BK[el.dataset.b]=el.value});
app.addEventListener("keydown",e=>{const ay=e.target.closest&&e.target.closest("[data-ay]");if(ay&&(e.key==="Enter"||e.key===" ")){e.preventDefault();ay.click()}});
app.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="bk")submit()});
render();

  const u=await window.claude.use("user");if(u){try{uid=await u.id()}catch(e){}}if(location.hash==="#team")render()}catch(e){db=null}})();
