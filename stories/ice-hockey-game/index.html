<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b2150">
<title>Ibrahim &amp; Junaid – The Ice Hockey Game · Abrar</title>
<meta name="description" content="Read the Abrar story “Ibrahim &amp; Junaid – The Ice Hockey Game” online: a comic about friendship, teamwork and controlling anger.">
<meta property="og:title" content="Ibrahim &amp; Junaid – The Ice Hockey Game">
<meta property="og:image" content="pages/001.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
:root{
  --desk:#eee8eb; --desk-2:#e0d6dc; --ink:#2a1823; --muted:#6e5966;
  --tray:#ffffff; --tray-line:#e0d2da; --plum:#6b2150; --plum-soft:#f3e1eb;
  --rose:#d6303a; --paper:#fffaf2; --shadow:rgba(40,16,30,.28);
  --f-ui:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --desk:#1b1418; --desk-2:#120d10; --ink:#f1e8ed; --muted:#b19da9;
  --tray:#261c22; --tray-line:#3d2d36; --plum:#e7a2c9; --plum-soft:#3d1e30;
  --rose:#ff6b6b; --shadow:rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 40%,var(--desk) 0%,var(--desk-2) 100%) fixed,var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--plum);outline-offset:2px;border-radius:8px}
.app{height:100%;width:100%;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}

.top{display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1;text-decoration:none}
.brand .t{min-width:0}
.brand b{display:block;font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;flex:none}
.ibtn:hover{background:var(--plum-soft)}
.ibtn svg{width:22px;height:22px}
.ibtn:disabled{opacity:.35;cursor:default;background:none}
.nav{display:flex;align-items:center;gap:2px;background:var(--tray);border:1px solid var(--tray-line);border-radius:14px;padding:2px}
.nav .ibtn{width:36px;height:36px}
.pgin{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 4px}
.pgin input{width:42px;text-align:center;font:inherit;font-weight:700;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 2px}
.pgin input:hover,.pgin input:focus{border-color:var(--tray-line);background:var(--desk)}
.dl{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;background:var(--plum);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap}
@media (prefers-color-scheme:dark){.dl{color:#2a1823}}
.dl svg{width:18px;height:18px}

.stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden;touch-action:pan-y;padding:4px 12px 8px}
.book{display:flex;filter:drop-shadow(0 18px 30px var(--shadow));transition:opacity .18s ease,transform .18s ease}
.book.out-l{opacity:0;transform:translateX(-18px)}
.book.out-r{opacity:0;transform:translateX(18px)}
.pg{background:var(--paper);position:relative;overflow:hidden}
.pg img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.book.two .pg:first-child{border-radius:6px 0 0 6px}
.book.two .pg:last-child{border-radius:0 6px 6px 0}
.book.two .pg:first-child::after{content:"";position:absolute;inset:0 0 0 auto;width:28px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.10))}
.book.two .pg:last-child::after{content:"";position:absolute;inset:0 auto 0 0;width:28px;background:linear-gradient(270deg,transparent,rgba(0,0,0,.10))}
.book.one .pg{border-radius:6px}
.hit{position:absolute;top:0;bottom:0;width:22%;z-index:2;cursor:pointer}
.hit.l{left:0}.hit.r{right:0}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:48px;height:48px;border-radius:50%;background:var(--tray);border:1px solid var(--tray-line);display:grid;place-items:center;box-shadow:0 6px 18px -6px var(--shadow)}
.arrow svg{width:24px;height:24px}
.arrow.l{left:max(14px,env(safe-area-inset-left))}.arrow.r{right:max(14px,env(safe-area-inset-right))}
.arrow:disabled{opacity:0;pointer-events:none}

.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 14px max(10px,env(safe-area-inset-bottom));color:var(--muted);font-size:13.5px}
.prog{flex:1;max-width:520px;height:5px;border-radius:5px;background:var(--tray-line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--plum);border-radius:5px;transition:width .25s}
.chap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;font-weight:700;color:var(--ink)}

/* contents drawer */
.scrim{position:fixed;inset:0;background:rgba(20,8,15,.35);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(380px,92vw);background:var(--tray);z-index:21;display:flex;flex-direction:column;box-shadow:10px 0 40px -10px var(--shadow);padding-top:env(safe-area-inset-top)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px 18px}
.dh h2{margin:0;font-size:20px}
.toc{list-style:none;margin:0;padding:4px 10px 20px;overflow:auto}
.toc button{width:100%;display:flex;align-items:center;gap:12px;padding:7px 8px;border-radius:12px;text-align:left}
.toc button:hover{background:var(--plum-soft)}
.toc button[aria-current="true"]{background:var(--plum-soft);font-weight:700}
.toc img{width:44px;height:62px;object-fit:cover;border-radius:4px;border:1px solid var(--tray-line);flex:none;background:var(--paper)}
.toc span{flex:1}
.toc em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}

@media (max-width:640px){
  .brand small,.dl span,.pgin .of{display:none}
  .top{gap:4px;padding-left:max(6px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
  .brand b{font-size:16px}
  .dl{padding:0 10px}
  .nav .ibtn{width:34px}
  .arrow{display:none}
  .chap{max-width:60vw}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="ibtn" href="../../index.html#stories" aria-label="Back to the Abrar website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <button class="ibtn" id="tocBtn" aria-label="Contents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <div class="brand"><div class="t"><b>Ibrahim &amp; Junaid</b><small>The Ice Hockey Game · Book 1</small></div></div>
    <div class="nav">
      <button class="ibtn" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <label class="pgin"><input id="pg" inputmode="numeric" aria-label="Page number" value="1"><span class="of">/ <span id="n">30</span></span></label>
      <button class="ibtn" id="next" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <a class="dl" href="Ibrahim-and-Junaid-The-Ice-Hockey-Game.pdf" download aria-label="Download PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>PDF</span></a>
  </header>

  <main class="stage" id="stage" aria-live="polite">
    <button class="arrow l" id="aPrev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="book" id="book"></div>
    <button class="arrow r" id="aNext" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </main>

  <footer class="bar"><span class="chap" id="chap"></span><div class="prog"><i id="prog"></i></div></footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Contents">
  <div class="dh"><h2>Contents</h2><button class="ibtn" id="closeToc" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <ul class="toc" id="toc"></ul>
</aside>

<script>
const N=30, ASP=595.276/419.528;
const TITLES={1:"Cover",2:"A Notice on the Board",3:"A New Teammate",4:"The Big Plan",5:"Nobody Builds Alone",6:"Off to the Rink",7:"Equipment First",8:"The Invisible Hole",9:"Pass or Shoot?",10:"Left Out",11:"Words That Hurt",12:"A Quiet Car Ride",13:"A Familiar Place",14:"A Moment of Peace",15:"More Than a Magic Shot",16:"The Apology",17:"Practice Without Ice",18:"A Promise",19:"Game On!",20:"A Goal for the Other Team",21:"An Old Habit",22:"The First Try",23:"The Equaliser",24:"A Different Kind of Celebration",25:"A Helping Hand",26:"The Final Attack",27:"No Trophy. Still a Good Day.",28:"The Team Photo",29:"A Plan for Monday",30:"Better Together"};
const src=p=>"pages/"+String(p).padStart(3,"0")+".webp";
const $=s=>document.querySelector(s);
const book=$("#book"),stage=$("#stage");
let p=1;
try{const h=+(location.hash.match(/p=(\d+)/)||[])[1];if(h>=1&&h<=N)p=h;else{const s=+localStorage.getItem("abrar-ihg-page");if(s>=1&&s<=N)p=s;}}catch(e){}

const twoUp=()=>{const w=stage.clientWidth-24,h=stage.clientHeight-12;return w/h>1.05&&w>700;};
// spreads: [1], [2,3], [4,5] ... [28,29], [30]
function pagesFor(q){if(!twoUp())return[q];if(q===1||q===N)return[q];const a=q%2===0?q:q-1;return a+1<N?[a,a+1]:[a];}
function stepFrom(q,d){if(!twoUp())return q+d;const cur=pagesFor(q);return d>0?cur[cur.length-1]+1:cur[0]-1;}

function size(n){
  const w=stage.clientWidth-(innerWidth>640?140:16),h=stage.clientHeight-14;
  let ph=h,pw=ph/ASP;
  if(pw*n>w){pw=w/n;ph=pw*ASP;}
  return [Math.floor(pw),Math.floor(ph)];
}
function render(dir){
  const ps=pagesFor(p);const [pw,ph]=size(ps.length);
  const build=()=>{
    book.className="book "+(ps.length===2?"two":"one");
    book.innerHTML="";
    ps.forEach((q,i)=>{
      const d=document.createElement("div");d.className="pg";d.style.width=pw+"px";d.style.height=ph+"px";
      const im=new Image();im.src=src(q);im.alt="Page "+q+(TITLES[q]?" – "+TITLES[q]:"");im.decoding="async";
      d.appendChild(im);book.appendChild(d);
    });
    const l=document.createElement("div");l.className="hit l";l.onclick=()=>go(-1);
    const r=document.createElement("div");r.className="hit r";r.onclick=()=>go(1);
    book.append(l,r);book.style.position="relative";
  };
  if(dir){book.classList.add(dir>0?"out-l":"out-r");setTimeout(()=>{build();requestAnimationFrame(()=>book.classList.remove("out-l","out-r"));},150);}
  else build();
  const last=ps[ps.length-1];
  $("#pg").value=ps.length===2?ps[0]+"–"+ps[1]:ps[0];
  $("#pg").style.width=ps.length===2?"58px":"42px";
  $("#prev").disabled=$("#aPrev").disabled=ps[0]<=1;
  $("#next").disabled=$("#aNext").disabled=last>=N;
  $("#prog").style.width=(last/N*100)+"%";
  const t=ps.map(q=>TITLES[q]).filter(Boolean);
  $("#chap").textContent=t.join(" · ");
  document.querySelectorAll(".toc button").forEach(b=>b.setAttribute("aria-current",String(ps.includes(+b.dataset.p))));
  try{history.replaceState(null,"","#p="+p);localStorage.setItem("abrar-ihg-page",p)}catch(e){}
  // preload neighbours
  [last+1,last+2,ps[0]-1,ps[0]-2].forEach(q=>{if(q>=1&&q<=N){const i=new Image();i.src=src(q);}});
}
function go(d){const q=stepFrom(p,d);if(q<1||q>N)return;p=q;render(d);}
function jump(q){q=Math.max(1,Math.min(N,q|0));if(!q)return;const d=q>p?1:-1;p=q;render(d);}

$("#prev").onclick=$("#aPrev").onclick=()=>go(-1);
$("#next").onclick=$("#aNext").onclick=()=>go(1);
$("#pg").addEventListener("focus",e=>{e.target.value=pagesFor(p)[0];e.target.select();});
$("#pg").addEventListener("change",e=>{jump(parseInt(e.target.value,10));e.target.blur();});
$("#pg").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur();});
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();go(1);}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(-1);}
  else if(e.key==="Home")jump(1);else if(e.key==="End")jump(N);
  else if(e.key==="Escape")closeToc();
});
// swipe
let sx=null,sy=null;
stage.addEventListener("touchstart",e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}else sx=null;},{passive:true});
stage.addEventListener("touchend",e=>{if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx<0?1:-1);},{passive:true});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>render(0),120);});

// contents
const toc=$("#toc");
for(let q=1;q<=N;q++){
  const li=document.createElement("li"),b=document.createElement("button");b.dataset.p=q;
  b.innerHTML=`<img loading="lazy" alt="" src="${src(q)}"><span></span><em>${q}</em>`;b.querySelector("span").textContent=TITLES[q]||("Page "+q);
  b.onclick=()=>{jump(q);closeToc();};li.appendChild(b);toc.appendChild(li);
}
function openToc(){$("#drawer").hidden=false;$("#scrim").hidden=false;const c=toc.querySelector('[aria-current="true"]');if(c)c.scrollIntoView({block:"center"});}
function closeToc(){$("#drawer").hidden=true;$("#scrim").hidden=true;}
$("#tocBtn").onclick=openToc;$("#closeToc").onclick=closeToc;$("#scrim").onclick=closeToc;

render(0);
</script>
</body>
</html>
