<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ee7a2b">
<title>Seerah with Fuffl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: a story app — header with stars, Fuffl the fox greets, four big doors (Lebensweg, Karte, Familie, Freunde); each opens a full-screen view. Desert night palette: deep indigo, warm fox orange, palm green. */
:root{
  --bg:#eef2f8; --bg-2:#dde4f0; --card:#ffffff; --ink:#1c2440; --muted:#5b6582; --line:#cfd8e8;
  --fox:#ee7a2b; --fox-soft:#fde4d1; --palm:#24946a; --palm-soft:#d3efe2; --gold:#f2b632; --gold-soft:#fdf0cc;
  --sky:#3a5bb0; --sky-soft:#dbe4f7; --sand:#e9cf98; --sea:#a9c7ea; --land:#ecd9ae;
  --ok:#1f9d55; --ok-soft:#d6f3e1; --bad:#e0413a; --bad-soft:#fde0dd; --lock:#b9c2d4;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"Noto Naskh Arabic","Amiri","Geeza Pro",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111729; --bg-2:#0b1020; --card:#1a2238; --ink:#e9edf8; --muted:#9ea8c4; --line:#2b3654;
  --fox:#ff9a52; --fox-soft:#3d2617; --palm:#4fc493; --palm-soft:#16362a; --gold:#ffcf5c; --gold-soft:#3a3018;
  --sky:#86a5ff; --sky-soft:#1d2a4d; --sand:#8a764c; --sea:#22385e; --land:#4a4232;
  --ok:#47c97f; --ok-soft:#163a27; --bad:#ff6e66; --bad-soft:#3d1c1b; --lock:#3a4560; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111729; --bg-2:#0b1020; --card:#1a2238; --ink:#e9edf8; --muted:#9ea8c4; --line:#2b3654;
  --fox:#ff9a52; --fox-soft:#3d2617; --palm:#4fc493; --palm-soft:#16362a; --gold:#ffcf5c; --gold-soft:#3a3018;
  --sky:#86a5ff; --sky-soft:#1d2a4d; --sand:#8a764c; --sea:#22385e; --land:#4a4232;
  --ok:#47c97f; --ok-soft:#163a27; --bad:#ff6e66; --bad-soft:#3d1c1b; --lock:#3a4560; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.saw{font-family:var(--f-ar);font-size:1.05em}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.back{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--muted);border-radius:12px;padding:6px 10px 6px 6px}
.back:hover{background:var(--bg-2)}
.back svg{width:22px;height:22px}
.logo{flex:1;min-width:0;font-family:var(--f-display);font-weight:800;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo span{color:var(--fox)}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-decoration:none;color:inherit;flex:none}
.chip svg{width:20px;height:20px}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding-block:14px 8px}
.fox{width:120px;height:auto}
.hero h1{font-size:clamp(26px,5.6vw,38px);font-weight:800}
.hero p{margin:6px 0 0;color:var(--muted);font-size:17px;max-width:48ch}
@media (max-width:520px){.hero{grid-template-columns:1fr;justify-items:start}.fox{width:96px}}
.note{background:var(--gold-soft);border-radius:16px;padding:10px 14px;font-size:14.5px;color:color-mix(in srgb,var(--gold) 30%,var(--ink));margin:6px 0 14px}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:30px}
@media (max-width:520px){.doors{grid-template-columns:1fr}}
.door{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px 16px;display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;text-align:left;box-shadow:0 5px 0 var(--line);transition:transform .1s}
.door:hover{transform:translateY(-2px)}
.door svg{width:84px;height:66px}
.door h2{font-size:22px}
.door small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.door .prog{margin-top:8px}
.bar{height:10px;background:var(--bg-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--palm);border-radius:999px}

/* path */
.path{position:relative;padding:10px 0 30px}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;width:170px;margin:4px 0 14px;z-index:1}
.node{width:96px;height:80px;border-radius:24px;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;box-shadow:0 5px 0 var(--line)}
.node svg{width:74px;height:56px}
.stop.locked .node{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.stop.done .node{border-color:var(--palm);box-shadow:0 5px 0 var(--palm)}
.stop.next .node{border-color:var(--fox);box-shadow:0 5px 0 var(--fox)}
.stop .yr{font-size:12px;font-weight:800;color:var(--fox);margin-top:8px;letter-spacing:.04em}
.stop .lb{font-weight:800;font-size:14px;text-align:center;line-height:1.2}
.stars{display:flex;gap:2px;margin-top:2px}.stars svg{width:16px;height:16px}

/* lesson */
.screen{position:fixed;inset:0;background:var(--bg);z-index:20;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lbar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.x{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{background:var(--bg-2)} .x svg{width:26px;height:26px}
.pbar{flex:1;height:14px;background:var(--bg-2);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--fox);border-radius:999px;transition:width .35s}
.main{overflow:auto}
.main .wrap{padding-block:6px 24px;display:grid;gap:16px;justify-items:center}
.story{background:var(--card);border:3px solid var(--line);border-radius:28px;box-shadow:0 6px 0 var(--line);width:100%;max-width:580px;padding:18px 20px 22px;display:grid;gap:12px;justify-items:center;text-align:center}
.story .scene{width:100%;max-width:300px;height:auto}
.story h3{font-size:26px;font-weight:800}
.story .yr{font-weight:800;color:var(--fox);font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.story p{margin:0;font-size:18px;line-height:1.55;max-width:44ch;text-align:left}
.fuffel{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--fox-soft);border-radius:18px;padding:10px 12px;max-width:520px;width:100%}
.fuffel svg{width:46px;height:46px;flex:none}
.fuffel span{font-weight:700;font-size:15px}
.ask{font-family:var(--f-display);font-weight:800;font-size:clamp(21px,4.4vw,27px);text-align:center;max-width:30ch}
.opts{display:grid;gap:10px;width:100%;max-width:520px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 var(--line);font-weight:800;font-size:18px;text-align:left}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 5px 0 var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 5px 0 var(--bad);color:var(--bad);animation:shake .35s}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.foot{border-top:2px solid var(--line);background:var(--bg)}
.foot.ok{background:var(--ok-soft);border-color:transparent}.foot.bad{background:var(--bad-soft);border-color:transparent}
.foot .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.fb{flex:1;min-width:200px}
.fb b{font-family:var(--f-display);font-size:21px;display:block}
.foot.ok .fb b{color:var(--ok)}.foot.bad .fb b{color:var(--bad)}
.fb span{font-weight:600}
.go{background:var(--fox);color:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;border-radius:16px;padding:9px 24px;box-shadow:0 5px 0 color-mix(in srgb,var(--fox) 60%,#000);margin-left:auto}
.go.ok{background:var(--ok);box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.go.bad{background:var(--bad);box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.go.ghost{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--line);margin-left:0}
.go:active{transform:translateY(3px)}

/* order game */
.order{display:grid;gap:10px;width:100%;max-width:520px}
.order .opt{display:flex;gap:12px;align-items:center}
.order .num{width:32px;height:32px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;font-family:var(--f-display);flex:none}
.order .opt.ok .num{background:var(--ok);color:#fff}

/* map */
.mapbox{width:100%;max-width:560px;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:8px;box-shadow:0 6px 0 var(--line)}
.mapbox svg{width:100%;height:auto;display:block;border-radius:16px}
.sea{fill:var(--sea)} .land{fill:var(--land);stroke:color-mix(in srgb,var(--land) 70%,#000);stroke-width:.6}
.pl circle.dot{fill:var(--fox);stroke:#fff;stroke-width:1.6;cursor:pointer}
.pl circle.hit{fill:transparent;cursor:pointer}
.pl text{font:800 8.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:2.2px}
.pl.ok circle.dot{fill:var(--ok)} .pl.bad circle.dot{fill:var(--bad)}
.pl.sel circle.dot{fill:var(--sky)}
.route{fill:none;stroke:var(--fox);stroke-width:1.8;stroke-dasharray:3 3}
.info{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px 14px;width:100%;max-width:560px}
.info h3{font-size:22px}
.info p{margin:4px 0 0}
.seg{display:flex;gap:6px;background:var(--bg-2);border-radius:14px;padding:4px}
.seg button{padding:7px 14px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* family */
.fam{width:100%;max-width:680px;display:grid;gap:16px}
.fsec h3{font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-body);font-weight:800;margin:0 0 8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.person{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 10px;text-align:left;display:grid;gap:0}
.person .ar{font-size:20px;color:var(--sky);line-height:1.5}
.person b{font-size:14.5px;line-height:1.25}
.person small{color:var(--muted);font-size:12.5px;line-height:1.3}
.person.center{background:var(--fox-soft);border-color:var(--fox)}
.fam .pr{font-size:13px;color:var(--muted)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
.card{aspect-ratio:3/4;border-radius:20px;padding:12px;display:grid;grid-template-rows:auto 1fr auto;text-align:center;justify-items:center;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 5px 0 color-mix(in srgb,var(--c2) 60%,#000);position:relative;overflow:hidden}
.card .ar{font-size:26px;line-height:1.5;align-self:center}
.card b{font-family:var(--f-display);font-size:17px;line-height:1.15}
.card small{font-size:12px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
.card.locked{background:var(--lock);box-shadow:0 5px 0 color-mix(in srgb,var(--lock) 60%,#000);color:color-mix(in srgb,var(--ink) 50%,transparent)}
.card .orn{position:absolute;inset:auto -20px -30px auto;width:110px;height:110px;opacity:.15}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,15,35,.5);display:grid;place-items:center;padding:16px}
.mcard{background:var(--card);border-radius:26px;max-width:420px;width:100%;padding:20px;display:grid;gap:10px;text-align:center;justify-items:center;max-height:88vh;overflow:auto}
.mcard .ar{font-size:34px;color:var(--sky);line-height:1.5}
.mcard h3{font-size:26px}
.mcard .tag{background:var(--gold-soft);border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px}
.mcard p{margin:0;font-size:17px;text-align:left}
.mcard .ra{font-size:13px;color:var(--muted)}

.result{display:grid;justify-items:center;gap:12px;text-align:center;padding-top:14px}
.result h2{font-size:38px}
.bigstars{display:flex;gap:8px}.bigstars svg{width:66px;height:66px}
.bigstars svg.on{animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
.newcard{background:var(--gold-soft);border:2px dashed var(--gold);border-radius:18px;padding:10px 14px;max-width:440px}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <button class="back" id="backBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Start</button>
  <div class="logo" id="logo">Seerah with <span>Fuffl</span></div>
  <a class="chip" href="../index.html" title="To the home page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Start</a>
  <div class="chip" title="Your stars"><svg viewBox="0 0 24 24"><path fill="#f2b632" stroke="#d99a10" stroke-width="1.2" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg><span id="starCount">0</span></div>
</div></header>
<main class="wrap" id="view"></main>
<section class="screen" id="screen" hidden>
  <div class="lbar"><div class="wrap"><button class="x" id="quit" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="pbar"><i id="pfill"></i></div></div></div>
  <div class="main"><div class="wrap" id="sbox"></div></div>
  <div class="foot" id="foot"><div class="wrap" id="fbox"></div></div>
</section>
<div class="modal" id="modal" hidden></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const h=(tag,props,...kids)=>{const e=document.createElement(tag);if(props)for(const k in props){const v=props[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}kids.flat().forEach(c=>c!=null&&e.append(c));return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
const SAW="ﷺ";
// text with ﷺ rendered in Arabic font
function rich(t){const f=document.createDocumentFragment();t.split(SAW).forEach((p,i,arr)=>{f.append(p);if(i<arr.length-1)f.append(h("span",{class:"saw",text:SAW}));});return f;}
const STAR='<svg viewBox="0 0 24 24"><path fill="F" stroke="S" stroke-width="1.2" d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>';
const star=on=>STAR.replace("F",on?"#f2b632":"var(--lock)").replace("S",on?"#d99a10":"transparent");

// ---------- Fuffl the fox ----------
const FOX=`<svg viewBox="0 0 140 140" aria-hidden="true">
<path d="M98 112c22 2 36-12 34-30-1-10-8-16-14-14 6 10 2 24-12 28z" fill="#ee7a2b"/><path d="M118 70c8 6 9 18 2 26 4-10 0-20-6-24z" fill="#fff"/>
<ellipse cx="68" cy="104" rx="30" ry="26" fill="#ee7a2b"/><ellipse cx="68" cy="110" rx="16" ry="17" fill="#fff4ea"/>
<path d="M28 30l12 34 18-14z" fill="#ee7a2b"/><path d="M108 30l-12 34-18-14z" fill="#ee7a2b"/>
<path d="M33 38l8 21 9-7z" fill="#5b2a14"/><path d="M103 38l-8 21-9-7z" fill="#5b2a14"/>
<path d="M68 34c-24 0-38 16-38 32 0 10 6 16 14 20l24 14 24-14c8-4 14-10 14-20 0-16-14-32-38-32z" fill="#ee7a2b"/>
<path d="M32 70c6 10 18 14 36 30 18-16 30-20 36-30-8 6-20 6-26 2l-10 8-10-8c-6 4-18 4-26-2z" fill="#fff4ea"/>
<circle cx="54" cy="62" r="5.5" fill="#1c2440"/><circle cx="82" cy="62" r="5.5" fill="#1c2440"/><circle cx="55.8" cy="60" r="1.8" fill="#fff"/><circle cx="83.8" cy="60" r="1.8" fill="#fff"/>
<ellipse cx="68" cy="84" rx="6" ry="4.5" fill="#1c2440"/><path d="M62 92q6 5 12 0" fill="none" stroke="#1c2440" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="44" cy="76" r="4.5" fill="#ff9e9e" opacity=".55"/><circle cx="92" cy="76" r="4.5" fill="#ff9e9e" opacity=".55"/>
<ellipse cx="54" cy="128" rx="9" ry="5" fill="#5b2a14"/><ellipse cx="82" cy="128" rx="9" ry="5" fill="#5b2a14"/></svg>`;
const fuffelSays=t=>h("div",{class:"fuffel"},h("span",{html:FOX}),h("span",null,rich(t)));

// ---------- scene icons (places & objects only, no people) ----------
const IC={

const ST=[
 {id:"s1",t:"The Year of the Elephant",yr:"around 570",ic:"elephant",cards:[
   "Makkah is a city in the desert. In its middle stands the Kaaba – the house that the Prophet Ibrahim and his son Ismail built for Allah.",
   "A king called Abraha wanted to destroy the Kaaba. He came with a great army and with elephants. But Allah sent flocks of birds that threw small stones. Surah Al-Fil – “The Elephant” – tells this story.",
   "In exactly this year a boy was born in Makkah: Muhammad ﷺ. His father Abdullah had already died before he was born. His mother was called Amina."],
  q:[["In which city was the Prophet ﷺ born?","Makkah","Madinah","Jerusalem"],["What was his mother called?","Amina","Khadija","Halima"],["What did Allah send against the army with the elephants?","Flocks of birds","A storm","An earthquake"]],
  fox:"Surah Al-Fil is short – maybe you already know it by heart?"},
 {id:"s2",t:"Childhood in the desert",yr:"childhood",ic:"tent",cards:[

   "From the moment little Muhammad ﷺ was with her, Halima's family had great blessing: their animals were well fed and gave plenty of milk again.",
   "When he was six years old, his mother Amina died. Then his grandfather Abd al-Muttalib looked after him – and when he died too, his uncle Abu Talib."],
  q:[["What was the name of his nursing mother in the desert?","Halima","Aisha","Fatima"],["Who looked after him after his grandfather died?","His uncle Abu Talib","Abu Bakr","Umar"],["How old was he when his mother died?","6 years old","12 years old","20 years old"]],
  fox:"He knew what it is like to be without parents. That is why he was always especially kind to orphans later on."},
 {id:"s3",t:"Al-Amin – the Trustworthy",yr:"youth",ic:"camel",cards:[
   "As a boy, Muhammad ﷺ looked after sheep. Later he travelled with his uncle Abu Talib in caravans as far as Syria and learnt how to trade.",
   "He never lied and gave back everything people trusted him with. That is why the people of Makkah called him “al-Amin” – the Trustworthy.",
   "When the Kaaba was rebuilt, the tribes argued about who could put the Black Stone back in its place. Muhammad ﷺ put the stone on a cloth – and all the tribes carried it together. That ended the argument."],
  q:[["What does “al-Amin” mean?","The Trustworthy","The Strong","The Rich"],["How did he settle the argument about the Black Stone?","All the tribes carried it on a cloth","He put it in place on his own","He let a draw decide"],["What did he look after as a boy?","Sheep","Horses","Chickens"]],
  fox:"Being honest makes you strong. Whom do you trust – and who trusts you?"},
 {id:"s4",t:"Khadija",yr:"aged 25",ic:"lamp",unlock:["khadija"],cards:[
   "Khadija was a wise and honest merchant in Makkah. She sent Muhammad ﷺ to Syria with her goods – and he came back with a big profit.",
   "She admired his honesty and married him. He was 25 years old at the time. Khadija was his first wife, and as long as she lived he married no other woman.",
   "They had six children: the sons al-Qasim and Abdullah, who died as small children, and the daughters Zaynab, Ruqayya, Umm Kulthum and Fatima."],
  q:[["Who was his first wife?","Khadija","Aisha","Sawda"],["How old was he when they married?","25 years old","40 years old","15 years old"],["How many daughters did they have?","4","2","6"]],

 {id:"s5",t:"Read! – The Cave of Hira",yr:"aged 40",ic:"cave",unlock:["ali"],cards:[
   "Muhammad ﷺ often reflected about Allah. For this he went to a small cave on the mountain an-Nur near Makkah: the Cave of Hira.",
   "When he was 40 years old, in the month of Ramadan, the angel Jibril came to him and said: “Iqraʾ – Read!” This is how the first verses of the Quran came, from Surah Al-ʿAlaq.",
   "Frightened, he hurried home. Khadija comforted him and was the first to believe him. Soon Abu Bakr, young Ali and Zayd ibn Haritha believed too."],
  q:[["What was the first word Jibril said?","Iqraʾ – Read!","Salam – Peace!","Sabr – Patience!"],["Which angel brought the revelation?","Jibril","Mikail","Israfil"],["How old was the Prophet ﷺ then?","40 years old","25 years old","63 years old"]],
  fox:"The first word of the Quran was “Read!” – that is why we learn to read. Just like you do in “Harf by Harf”!"},
 {id:"s6",t:"Standing firm in Makkah",yr:"the first years",ic:"stone",unlock:["bilal","umar"],cards:[
   "The Prophet ﷺ called people to worship Allah alone. Many powerful people in Makkah became angry and tormented the Muslims.",
   "Bilal, a slave, was tormented in the midday heat with a heavy stone on his chest. But he only ever said: “Ahad, Ahad – Allah is One!” Abu Bakr bought his freedom.",

  fox:"New friend cards: Bilal and Umar!"},
 {id:"s7",t:"The Year of Sorrow & Taif",yr:"around 619",ic:"mount",unlock:["zayd"],cards:[

  q:[["Who died in the “Year of Sorrow”?","Khadija and Abu Talib","Amina and Abdullah","Abu Bakr and Umar"],["Which town did he go to afterwards?","Taif","Madinah","Jerusalem"],["What did he do when people threw stones at him?","He prayed for them","He cursed them","He threw stones back"]],
  fox:"When someone is mean to you – can you still stay kind? That is real strength."},
 {id:"s8",t:"The Night Journey",yr:"before the Hijrah",ic:"moon",unlock:["abubakr"],cards:[

   "Many in Makkah laughed at this story. But Abu Bakr said straight away: “If he says it, then it is true.” That is why he is called “as-Siddiq” – the Truthful."],
  q:[["Where did the Prophet ﷺ travel to in the night?","To the Al-Aqsa Mosque in Jerusalem","To Madinah","To Abyssinia"],["What gift did he receive in the heavens?","Five prayers a day","Ramadan","The Kaaba"],["Why is Abu Bakr called “as-Siddiq”?","He believed him straight away","He was very rich","He was very strong"]],
  fox:"Every time you pray, you remember the gift of the Night Journey."},
 {id:"s9",t:"The Hijrah",yr:"622",ic:"palm",unlock:["asma"],cards:[

   "In Quba he built the first mosque. Then he reached Yathrib, and the people sang with joy. From then on the town was called Madinah – “the City of the Prophet”. The Islamic calendar begins with the Hijrah."],
  q:[["Who went with him on the Hijrah?","Abu Bakr","Umar","Bilal"],["In which cave did they hide?","The Cave of Thawr","The Cave of Hira","The Cave of Uhud"],["Where did he build the first mosque?","In Quba","In Makkah","In Taif"]],
  fox:"Hijrah means emigration. Our calendar counts the years since that day!"},
 {id:"s10",t:"Life in Madinah",yr:"from 622",ic:"mosque",unlock:["abuayyub"],cards:[

 {id:"s11",t:"Badr, Uhud and the Trench",yr:"2–5 AH",ic:"hill",unlock:["hamza","salman"],cards:[

 {id:"s12",t:"Back to Makkah",yr:"8 AH",ic:"key",unlock:["uthman"],cards:[

 {id:"s13",t:"The Farewell",yr:"10–11 AH",ic:"arafat",unlock:["aischa","fatima"],cards:[

// ---------- cards ----------
function showCards(){
  view.append(h("h1",{style:"font-size:30px;margin-top:8px",text:"Friend cards"}));
  view.append(h("p",{style:"color:var(--muted);margin:4px 0 12px"},rich("With every stop on his life journey you collect cards of people who were close to the Prophet ﷺ.")));
  const g=h("div",{class:"cards"});
  Object.entries(FRIENDS).forEach(([id,f])=>{const have=S.cards.includes(id);
    const c=h("button",{class:"card"+(have?"":" locked"),style:`--c1:${f.c[0]};--c2:${f.c[1]}`},h("small",{text:have?f.tag:"?"}),h("span",{class:"ar",text:have?f.a:"؟"}),h("b",{text:have?f.n:"Still locked"}),h("span",{class:"orn",html:'<svg viewBox="0 0 100 100"><path d="M50 0l12 38h38L69 61l12 39-31-24-31 24 12-39L0 38h38z" fill="#fff"/></svg>'}));

    g.append(c);});

  }else view.append(h("p",{style:"color:var(--muted);padding-bottom:30px",text:"With 4 cards or more you can play “Who am I?”."}));
}

route();
