<style>
/* Layout: a reading desk — slim header with title + page nav, the book centred on the desk, a floating writing-tool tray at the bottom. */
:root{
  --desk:#eee8eb; --desk-2:#e0d6dc; --ink:#2a1823; --muted:#6e5966;
  --tray:#ffffff; --tray-line:#e0d2da; --teal:#6b2150; --teal-soft:#f3e1eb;
  --rose:#d6303a; --paper:#fbfaf7; --shadow:rgba(20,40,38,.28);
  --f-ui:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  --f-hand:"Caveat","Comic Sans MS","Segoe Print",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#1b1418; --desk-2:#120d10; --ink:#f1e8ed; --muted:#b19da9;
  --tray:#261c22; --tray-line:#3d2d36; --teal:#e7a2c9; --teal-soft:#3d1e30;
  --rose:#ff6b6b; --paper:#f4f2ec; --shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#1b1418; --desk-2:#120d10; --ink:#f1e8ed; --muted:#b19da9;
  --tray:#261c22; --tray-line:#3d2d36; --teal:#e7a2c9; --teal-soft:#3d1e30;
  --rose:#ff6b6b; --paper:#f4f2ec; --shadow:rgba(0,0,0,.6); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 40%,var(--desk) 0%,var(--desk-2) 100%) fixed,var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand b{font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .ar{font-family:var(--f-ar);color:var(--rose);font-size:22px;line-height:1}
.save{font-size:12.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.save.ok i{background:var(--teal)} .save.busy i{background:var(--rose)}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;flex:none}
.ibtn:hover{background:var(--teal-soft)}
.ibtn svg{width:22px;height:22px}
.nav{display:flex;align-items:center;gap:2px;background:var(--tray);border:1px solid var(--tray-line);border-radius:14px;padding:2px}
.nav .ibtn{width:36px;height:36px}
.pgin{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 4px}
.pgin input{width:46px;text-align:center;font:inherit;font-weight:700;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 2px}
.pgin input:hover,.pgin input:focus{border-color:var(--tray-line);background:var(--desk)}

/* stage */
.top{grid-row:1}.fbar{grid-row:2}.trayWrap{grid-row:4}
.stage{grid-row:3;touch-action:pan-x pan-y;position:relative;overflow:auto;display:grid;min-height:0;overscroll-behavior:contain}
.book{margin:auto;position:relative;display:flex;perspective:2600px;transition:filter .2s}
.slot{position:relative}
.pg{position:relative;background:var(--paper);overflow:hidden;container-type:inline-size;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}
.pg.real{box-shadow:0 1px 2px var(--shadow),0 18px 40px -12px var(--shadow)}
.pg img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.pg svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pg svg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pg svg path.hl{mix-blend-mode:multiply}
.slot.l .pg.real::after,.slot.r .pg.real::after{content:"";position:absolute;top:0;bottom:0;width:7%;pointer-events:none}
.slot.l .pg.real::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.16),transparent)}
.slot.r .pg.real::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.13),transparent)}
.drawing .pg.real{touch-action:none;cursor:crosshair}
.tool-text .pg.real{cursor:text}
.tool-erase .pg.real{cursor:cell}

.note{position:absolute;min-width:3cqw;max-width:60cqw;font-family:var(--f-hand);font-weight:700;font-size:3.4cqw;line-height:1.1;padding:.2cqw .6cqw;border-radius:.6cqw;white-space:pre-wrap;word-break:break-word;outline:none;transform:translateY(-50%)}
.tool-text .note{background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(15,127,124,.35)}
.tool-text .note:focus{background:rgba(255,255,255,.85);box-shadow:0 0 0 2px var(--teal)}
.tool-erase .note{box-shadow:0 0 0 1px rgba(197,29,110,.5);cursor:pointer}

.leaf{position:absolute;top:0;transform-style:preserve-3d;z-index:5;will-change:transform}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face.back{transform:rotateY(180deg)}
.leaf .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,rgba(0,0,0,.18),rgba(0,0,0,0) 40%)}

.side{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:88px;border-radius:14px;display:grid;place-items:center;color:var(--muted);z-index:8}
.side:hover{background:var(--tray);color:var(--ink);box-shadow:0 4px 14px -6px var(--shadow)}
.side svg{width:26px;height:26px}
.side.prev{left:max(8px,env(safe-area-inset-left,0px))} .side.next{right:max(8px,env(safe-area-inset-right,0px))}
.side:disabled{opacity:0;pointer-events:none}

/* tray */
.trayWrap{display:flex;justify-content:center;padding-block:8px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tray{display:flex;align-items:center;gap:4px;background:var(--tray);border:1px solid var(--tray-line);border-radius:18px;padding:5px;box-shadow:0 10px 30px -14px var(--shadow);max-width:100%;min-width:0;overflow-x:auto;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;padding:6px 6px 4px;border-radius:13px;font-size:11.5px;font-weight:500;color:var(--muted);flex:none}
.tool svg{width:22px;height:22px}
.tool:hover{color:var(--ink);background:var(--desk)}
.tool[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal);font-weight:700}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--tray-line);flex:none}
.sw{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.sw span{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.tool.warn{color:var(--rose)}
.zoomLbl{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:38px;text-align:center;flex:none}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,19,.35);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:var(--tray);z-index:21;display:flex;flex-direction:column;box-shadow:10px 0 40px -10px var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px 18px}
.dh h2{margin:0;font-size:20px;font-weight:800}
.tabs{display:flex;gap:4px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--teal-soft);color:var(--teal);font-weight:700}
.dbody{overflow:auto;flex:1;padding:0 10px 20px}
.toc{list-style:none;margin:0;padding:0}
.toc li button{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;text-align:left;padding:9px 10px;border-radius:10px;font-size:15px}
.toc li button:hover{background:var(--desk)}
.toc li button.cur{background:var(--teal-soft);color:var(--teal);font-weight:700}
.toc li button small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.toc .ex{font-size:13.5px;padding-left:22px;color:var(--muted)}
.toc .ex span::before{content:"✎ ";color:var(--rose)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px;padding:4px}
.th{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:4px;border-radius:8px;position:relative}
.th img{width:100%;aspect-ratio:1/1.4142;object-fit:cover;background:var(--paper);box-shadow:0 1px 3px var(--shadow);border-radius:2px}
.th.cur{background:var(--teal-soft);color:var(--teal);font-weight:700}
.th .dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--tray)}
.empty{color:var(--muted);padding:20px 10px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--tray);padding:8px 14px;border-radius:10px;font-size:14px;z-index:30;pointer-events:none}

/* roles, feedback bar */
.role{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--teal-soft);color:var(--teal);white-space:nowrap;flex:none}
.role.t{background:color-mix(in srgb,var(--rose) 14%,transparent);color:var(--rose)}
.fbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding-block:0 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--tray);border:1px solid var(--tray-line);border-radius:14px;padding:5px 6px 5px 10px;min-width:0;max-width:100%}
.fbox.rev{border-color:color-mix(in srgb,var(--rose) 45%,var(--tray-line))}
.fbox b{font-size:13px;font-variant-numeric:tabular-nums}
.fbox .who{font-size:14px;font-weight:700;color:var(--rose)}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--tray-line);color:var(--muted);white-space:nowrap}
.pill[aria-pressed="true"].ok,.pill.ok.on{background:var(--teal-soft);border-color:transparent;color:var(--teal)}
.pill[aria-pressed="true"].redo,.pill.redo.on{background:color-mix(in srgb,#f5b400 22%,transparent);border-color:transparent;color:color-mix(in srgb,#a26f00 80%,var(--ink))}
.pill.plain{background:var(--desk)}
.fbox input{font:inherit;font-size:14px;color:var(--ink);background:var(--desk);border:1px solid var(--tray-line);border-radius:10px;padding:5px 9px;width:min(260px,52vw);min-width:0}
.fbox .msg{font-family:var(--f-hand);font-size:19px;font-weight:700;color:var(--rose);line-height:1.1;max-width:60ch}
.note.fbn{color:#d11a5f}
.tool-text .note.ro,.tool-erase .note.ro{box-shadow:none;background:none;cursor:inherit}
.note.ro{pointer-events:none}

/* drawer extras */
.chips{display:flex;gap:6px;padding:2px 6px 10px}
.chips button{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--tray-line);color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--tray);border-color:var(--ink)}
.th .stt{position:absolute;top:6px;left:8px;font-size:12px;font-weight:800;border-radius:999px;padding:0 6px;background:var(--tray);box-shadow:0 0 0 1px var(--tray-line)}
.th .stt.ok{color:var(--teal)} .th .stt.redo{color:#b07800}
.card{border:1px solid var(--tray-line);border-radius:14px;padding:12px;display:grid;gap:8px;margin:0 4px 10px}
.card h3{margin:0;font-size:16px;font-weight:800;text-wrap:balance}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);align-items:center}
.card .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lnk{color:var(--teal);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--teal)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 4px 16px;padding:12px;border-radius:14px;background:var(--desk)}
.form label{display:grid;gap:3px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;min-width:0}
.form label.full{grid-column:1/-1}
.form input{font:inherit;font-size:15px;color:var(--ink);background:var(--tray);border:1px solid var(--tray-line);border-radius:9px;padding:7px 9px;min-width:0;width:100%}
.btn{background:var(--teal);color:#fff;font-weight:700;border-radius:10px;padding:9px 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--rose);border:1px solid currentColor;padding:5px 10px;font-size:13px}
.sh{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.stu{width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:12px}
.stu:hover{background:var(--desk)} .stu.cur{background:var(--teal-soft)}
.stu img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--desk)}
.stu b{display:block;font-size:15px}
.stu small{color:var(--muted);font-size:12.5px}
.badge{font-size:12px;font-weight:800;background:var(--rose);color:#fff;border-radius:999px;padding:2px 8px;white-space:nowrap}
.badge.calm{background:var(--teal-soft);color:var(--teal)}
.hint{font-size:13px;color:var(--muted);line-height:1.45;padding:4px 10px 12px}

@media (max-width:640px){
  .brand b{font-size:16px} .top{gap:6px} .nav .ibtn{width:32px} .save span{display:none} .brand .ar{display:none}
  .tool{min-width:46px;font-size:10.5px} .side{display:none}
}
.brand .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex-direction:column;align-items:flex-start;gap:0}
.brand b{color:var(--teal)}
.logo{height:40px;width:auto;background:#fff;border-radius:10px;padding:4px 8px;flex:none;box-shadow:0 0 0 1px var(--tray-line)}
@media (max-width:900px){.brand .sub{display:none}}
@media (max-width:640px){.logo{height:30px;padding:3px 5px}.brand b{font-size:15px}.save{display:none}}
@media (max-width:420px){.brand{display:none}.top{justify-content:space-between}}
.game{display:inline-flex;align-items:center;gap:7px;background:var(--rose);color:#fff;font-weight:800;font-size:15px;text-decoration:none;border-radius:12px;padding:8px 14px;white-space:nowrap;flex:none;box-shadow:0 3px 0 color-mix(in srgb,var(--rose) 60%,#000)}
.game:hover{filter:brightness(1.07)}
.game.fox{background:#ee7a2b;box-shadow:0 3px 0 #a9521b}
@media (max-width:900px){.game span{display:none}.game{padding:8px 9px}}
.game svg{width:20px;height:20px}
@media (max-width:640px){.game span{display:none}.game{padding:8px 9px}}
@media (max-width:640px){
  .trayWrap{padding-block:4px 8px}
  .tray{flex-wrap:wrap;justify-content:space-between;overflow:visible;width:100%;gap:2px;row-gap:4px;border-radius:18px;padding:4px}
  .tray .tool[data-tool]{flex:1 1 0;min-width:0;min-height:52px;font-size:11px}
  .tray .sep{display:none}
  .tray .sep:nth-of-type(1){display:block;flex-basis:100%;height:1px;margin:2px 6px;background:var(--tray-line)}
  #zoomOut,#zoomIn,#zoomLbl{display:none}
  .app:not(.drawing) .tray .sw,.app:not(.drawing) #undoBtn,.app:not(.drawing) #clearBtn,.app:not(.drawing) .tray .sep:nth-of-type(1){display:none}
  .tray .sw{width:40px;height:40px} .tray .sw span{width:26px;height:26px}
  #undoBtn,#clearBtn{flex:0 0 auto;min-width:60px;flex-direction:row;gap:5px;font-size:12px;padding:8px}
  #undoBtn svg,#clearBtn svg{width:19px;height:19px}
  .drawer{width:100vw}
  .toc li button{padding:11px 10px}
}
.brand{overflow:hidden}
@media (max-height:500px) and (orientation:landscape){
  .top{padding-block:4px} .brand,.save{display:none} .top .nav{margin-left:auto}
  .logo{height:30px;padding:3px 6px} .game span{display:none} .game{padding:7px 9px}
  .trayWrap{padding-block:2px 4px} .tool{min-width:44px;padding:4px 4px 2px;font-size:10.5px} .tool svg{width:19px;height:19px}
  #zoomOut,#zoomIn,#zoomLbl{display:none} .side{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    <div class="nav">
      <button class="ibtn" id="prevBtn" aria-label="Faqja e mëparshme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>

// ---------- layers ----------
function Layer(name,editable,saver){
  return {name,d:{},editable,saver,
    page(p){return this.d[p]||(this.d[p]={s:[],n:[],u:0,st:"",msg:""});},
    has(p){const a=this.d[p];return !!a&&((a.s&&a.s.length>0)||(a.n&&a.n.some(n=>n.txt&&n.txt.trim())));},
    any(p){const a=this.d[p];return this.has(p)||!!(a&&(a.st||(a.msg&&a.msg.trim())));},
    save(p){if(this.d[p])this.d[p].u=Date.now();if(this.saver)this.saver(p);}};
}
function fromDoc(b){let v={};try{v=JSON.parse(b&&b.j||"{}")}catch(e){}return {s:v.s||[],n:v.n||[],u:(b&&b.u)||0,st:(b&&b.st)||"",msg:(b&&b.msg)||""};}

let saveLocalT=null;
const mine=Layer("mine",true,p=>{

  if(mine.has(p))meta.pu[p]=mine.d[p].u;else delete meta.pu[p];
  q.put(`hw/${role.id}/pages/p${p}`,()=>mine.has(p)?{j:clean(mine.d[p]),u:mine.d[p].u||Date.now()}:null);

});
const myFb=Layer("fb",false);
const revWork=Layer("rw",false);
const revFb=Layer("rf",true,p=>{
  const sid=st.rev;if(!sid||!role.online)return;
  const a=revFb.d[p];
  (fbU[sid]||(fbU[sid]={}))[p]=a?a.u:0;

const q={m:new Map(),t:null,run:false,
  put(path,fn){if(!role.online||role.readonly)return;this.m.set(path,fn);setSave("busy","Speichert …");clearTimeout(this.t);this.t=setTimeout(()=>this.flush(),1100);},
  async flush(){
    if(this.run)return;this.run=true;let ok=true;
    while(this.m.size){
      const [path,fn]=this.m.entries().next().value;this.m.delete(path);
      const body=fn();
      try{
        const ref=role.db.doc(path);
        if(body===null)await ref.delete();
        else{if(JSON.stringify(body).length>250000){toast("Faqja është shumë e mbushur – u ruajt vetëm në këtë pajisje");continue;}await ref.set(body);}

    this.run=false;

  }};

// ---------- connect ----------
const withTimeout=(pr,ms)=>Promise.race([pr,new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))]);
(async function connect(){
  try{
    if(!window.claude||!window.claude.use){setSave("","U ruajt në këtë pajisje");return;}
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){setSave("","U ruajt në këtë pajisje");return;}
    const me=await user.me();
    if(!me||!me.id){setSave("","U ruajt në këtë pajisje");return;}
    Object.assign(role,{db,user,id:me.id,owner:!!me.isOwner});
    setSave("busy","Po ngarkohet …");
    // own work
    const upload=new Set();
    const snap=await withTimeout(db.collection(`hw/${me.id}/pages`).limit(200).get(),10000);
    const seen=new Set();
    snap.docs.forEach(d=>{const p=+d.id.slice(1);if(!(p>=1&&p<=N))return;seen.add(p);const b=d.data()||{};
      if(!mine.d[p]||(b.u||0)>(mine.d[p].u||0))mine.d[p]=fromDoc(b);});
    // earlier version stored notes privately – bring them over once
    try{const old=await withTimeout(db.collection("data/users/"+me.id).limit(200).get(),6000);
      old.docs.forEach(d=>{const p=+d.id.slice(1);if(!(p>=1&&p<=N))return;const b=d.data()||{};if(!mine.d[p]||(b.u||0)>(mine.d[p].u||0)){mine.d[p]=fromDoc(b);upload.add(p);}});}catch(e){}
    try{const m=await withTimeout(db.doc(`hw/${me.id}`).get(),6000);if(m.exists){const b=m.data()||{};meta.done=Object.assign({},b.done||{});meta.nick=b.nick||"";}}catch(e){}
    for(const k in mine.d){const p=+k;if(mine.has(p)){meta.pu[p]=mine.d[p].u||1;if(!seen.has(p))upload.add(p);}}
    try{localStorage.setItem("abrar-ann-v1",JSON.stringify(mine.d))}catch(e){}
    role.online=true;
    upload.forEach(p=>mine.saver(p));
    setSave("ok",savedText());
    // assignments
    db.collection("tasks").onSnapshot(qs=>{tasks=qs.docs.map(d=>Object.assign({id:d.id},d.data()||{})).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")||(a.u||0)-(b.u||0));refreshDrawer();},()=>{});
    if(role.owner){
      db.collection("hw").onSnapshot(qs=>{
        qs.docChanges().forEach(c=>{const sid=c.doc.id;if(sid===role.id)return;
          if(c.type==="removed")delete students[sid];else students[sid]=c.doc.data()||{};
          if(!fbU[sid]){fbU[sid]={};db.collection(`fb/${sid}/pages`).limit(200).get().then(s=>{s.docs.forEach(d=>{fbU[sid][+d.id.slice(1)]=(d.data()||{}).u||0});refreshDrawer();},()=>{});}
        });
        refreshDrawer();
      },()=>{});
    }else{
      db.collection(`fb/${me.id}/pages`).onSnapshot(qs=>{
        let hit=false;const v=visible();
        qs.docChanges().forEach(c=>{const p=+c.doc.id.slice(1);if(c.type==="removed")delete myFb.d[p];else myFb.d[p]=fromDoc(c.doc.data());if(v.includes(p))hit=true;});
        if(hit)schedRender();else updateBar();
        refreshDrawer();
      },()=>{});
    }
    updateRole();schedRender();
  }catch(e){setSave("","U ruajt në këtë pajisje");}
})();

// ---------- geometry ----------
const stage=$("#stage"), book=$("#book");
function spreadOf(p){const k=Math.floor(p/2);return k===0?[null,1]:[2*k,2*k+1<=N?2*k+1:null];}
function visible(){return st.spread?spreadOf(st.p).filter(Boolean):[st.p];}
function layout(){
  const r=stage.getBoundingClientRect();
  st.spread=r.width>=820&&r.height>=520;
  const cols=st.spread?2:1, padX=st.spread?120:(r.width<640?16:24), padY=r.width<640?8:26;
  let hh=r.height-padY*2, w=hh/ASP;
  if(w*cols>r.width-padX){w=(r.width-padX)/cols;hh=w*ASP;}
  if(!st.spread&&r.height<500&&r.width>r.height){w=Math.min(r.width-48,720);hh=w*ASP;}
  st.pw=Math.max(120,w*st.zoom); st.ph=st.pw*ASP;
}

// ---------- page element ----------
function pathD(d){
  if(d.length<4) return d.length===2?`M${d[0]} ${d[1]}l.01 0`:"";
  let s=`M${d[0]} ${d[1]}`;
  for(let i=2;i<d.length-2;i+=2){const mx=(d[i]+d[i+2])/2,my=(d[i+1]+d[i+3])/2;s+=`Q${d[i]} ${d[i+1]} ${mx} ${my}`;}
  return s+`L${d[d.length-2]} ${d[d.length-1]}`;
}
function strokeEl(s){
  const e=document.createElementNS("http://www.w3.org/2000/svg","path");
  e.setAttribute("d",pathD(s.d));e.setAttribute("stroke",s.c);e.setAttribute("stroke-width",s.w);
  if(s.t==="h"){e.setAttribute("class","hl");e.setAttribute("stroke-opacity",".38");}
  return e;
}
function pageEl(p,live){
  const el=document.createElement("div");
  el.style.width=st.pw+"px";el.style.height=st.ph+"px";
  if(!p){el.className="pg blank";el.style.background="transparent";return el;}
  el.className="pg real";el.dataset.p=p;
  const img=new Image();img.src=src(p);img.alt="Faqja "+label(p);img.draggable=false;img.decoding="async";
  el.appendChild(img);
  const EL=editLayer();let editSvg=null;
  layers().forEach(L=>{
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox",`0 0 ${VW} ${VH}`);svg.setAttribute("preserveAspectRatio","none");
    el.appendChild(svg);
    const a=L.d[p];const editable=live&&L===EL;
    if(a){a.s.forEach(s=>svg.appendChild(strokeEl(s)));a.n.forEach(n=>{if(editable||(n.txt&&n.txt.trim()))el.appendChild(noteEl(L,p,n,editable));});}
    if(L===EL)editSvg=svg;
  });
  if(live)bindPage(el,p,editSvg,EL);
  return el;
}
function noteEl(L,p,n,live){
  const d=document.createElement("div");
  d.className="note"+(L.name==="fb"||L.name==="rf"?" fbn":"")+(live?"":" ro");
  d.dir="auto";d.style.left=n.x+"%";d.style.top=n.y+"%";if(n.c)d.style.color=n.c;d.textContent=n.txt||"";
  if(live){
    d.contentEditable=st.tool==="text"?"true":"false";
    d.addEventListener("input",()=>{n.txt=d.innerText;L.save(p);});
    d.addEventListener("blur",()=>{if(!n.txt||!n.txt.trim()){const a=L.page(p);a.n=a.n.filter(x=>x!==n);d.remove();L.save(p);}flushPending();});
    d.addEventListener("pointerdown",e=>{
      if(st.tool==="erase"){e.stopPropagation();const a=L.page(p);const i=a.n.indexOf(n);if(i>-1){a.n.splice(i,1);undo.push({L,p,k:"un",item:n,i});d.remove();L.save(p);}}
      else if(st.tool==="text"){e.stopPropagation();}
    });
  }
  return d;
}

// ---------- drawing ----------
function toV(el,e){const r=el.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*VW),Math.round((e.clientY-r.top)/r.height*VH)];}
function eraseAt(L,p,svg,x,y){
  const a=L.d[p];if(!a)return;
  for(let i=a.s.length-1;i>=0;i--){
    const s=a.s[i],rr=Math.max(14,s.w/2+6);
    for(let j=0;j<s.d.length;j+=2){const dx=s.d[j]-x,dy=s.d[j+1]-y;if(dx*dx+dy*dy<rr*rr){a.s.splice(i,1);undo.push({L,p,k:"us",item:s,i});svg.children[i]&&svg.children[i].remove();L.save(p);break;}}
  }
}
function bindPage(el,p,svg,L){
  let cur=null,path=null;
  el.addEventListener("pointerdown",e=>{
    if(st.busy||e.button>0||st.tool==="read")return;
    if(e.pointerType==="touch"&&!e.isPrimary)return;
    const [x,y]=toV(el,e);
    if(st.tool==="text"){
      e.preventDefault();
      const n={id:Math.random().toString(36).slice(2,9),x:+(x/VW*100).toFixed(2),y:+(y/VH*100).toFixed(2),c:st.color,txt:""};
      L.page(p).n.push(n);undo.push({L,p,k:"n",item:n});
      const d=noteEl(L,p,n,true);el.appendChild(d);setTimeout(()=>d.focus(),0);
      return;
    }
    e.preventDefault();el.setPointerCapture(e.pointerId);st.drawing=true;
    if(st.tool==="erase"){cur={erase:true};eraseAt(L,p,svg,x,y);return;}
    const hl=st.tool==="hl";
    cur={t:hl?"h":"p",c:hl&&st.color==="#1b2a6b"?"#f5b400":st.color,w:hl?22:3.4,d:[x,y]};
    path=strokeEl(cur);svg.appendChild(path);
  });
  el.addEventListener("pointermove",e=>{
    if(!cur)return;
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of (evs.length?evs:[e])){
      const [x,y]=toV(el,ev);
      if(cur.erase){eraseAt(L,p,svg,x,y);continue;}
      const n=cur.d.length,dx=x-cur.d[n-2],dy=y-cur.d[n-1];
      if(dx*dx+dy*dy>=4)cur.d.push(x,y);
    }
    if(!cur.erase)path.setAttribute("d",pathD(cur.d));
  });
  const end=()=>{
    if(!cur)return;
    if(!cur.erase){L.page(p).s.push(cur);undo.push({L,p,k:"s",item:cur});L.save(p);}
    cur=null;path=null;st.drawing=false;flushPending();
    if(st.mode==="review")updateBar();
  };
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
}

// ---------- render ----------
function busyUI(){const a=document.activeElement;return st.busy||st.drawing||(a&&(a.classList.contains("note")||(a.closest&&a.closest("#fbar"))));}
function schedRender(){if(busyUI()){st.pending=true;return;}render();}
function flushPending(){if(st.pending){setTimeout(()=>{if(st.pending&&!busyUI()){st.pending=false;render();}},0);}}
function render(){
  layout();
  book.innerHTML="";
  const app=$("#app");
  app.classList.toggle("drawing",st.tool!=="read");
  ["text","erase"].forEach(t=>app.classList.toggle("tool-"+t,st.tool===t));
  if(st.spread){
    const [L,R]=spreadOf(st.p);
    book.append(h("div",{class:"slot l"},pageEl(L,true)),h("div",{class:"slot r"},pageEl(R,true)));
  }else book.append(h("div",{class:"slot"},pageEl(st.p,true)));
  updateNav();updateBar();preload();
}
function updateNav(){
  const v=visible();
  $("#pgInput").value=v.length>1?label(v[0])+"–"+label(v[1]):label(v[0]);
  $("#pgInput").style.width=(v.length>1?70:46)+"px";
  const first=st.p<=1,last=st.spread?(spreadOf(st.p)[1]===null||spreadOf(st.p)[1]>=N):st.p>=N;

  sidePrev.disabled=first;sideNext.disabled=last;
  $("#zoomLbl").textContent=Math.round(st.zoom*100)+" %";
  try{history.replaceState(null,"",st.p===1?location.pathname+location.search:"#seite-"+label(st.p));}catch(e){}
}
function preload(){const v=visible();[v[0]-2,v[0]-1,v[v.length-1]+1,v[v.length-1]+2,v[v.length-1]+3].forEach(p=>{if(p>=1&&p<=N){const i=new Image();i.src=src(p);}});}

// ---------- flipping ----------
const reduce=matchMedia("(prefers-reduced-motion: reduce)");
function target(dir){
  if(st.spread){const k=Math.floor(st.p/2)+dir;if(k<0)return null;const p=k===0?1:2*k;return p>N?null:p;}
  const p=st.p+dir;return p<1||p>N?null:p;
}
function next(){const t=target(1);if(t)go(t);}
function prev(){const t=target(-1);if(t)go(t);}
function go(np){
  np=Math.max(1,Math.min(N,np|0));
  if(st.busy)return;
  const a=document.activeElement;if(a&&a.blur&&(a.classList.contains("note")||(a.closest&&a.closest("#fbar"))))a.blur();
  st.pending=false;
  const same=st.spread?Math.floor(np/2)===Math.floor(st.p/2):np===st.p;
  if(same){st.p=np;render();return;}
  const dir=np>st.p?1:-1;
  if(reduce.matches||st.zoom>1.01){st.p=np;render();stage.scrollTo(0,0);return;}
  st.busy=true;
  const finish=()=>{st.p=np;st.busy=false;render();};
  book.innerHTML="";
  const mk=(cls,el)=>h("div",{class:"slot "+cls},el);
  const leaf=h("div",{class:"leaf"});leaf.style.width=st.pw+"px";leaf.style.height=st.ph+"px";
  const face=(el,back)=>h("div",{class:"face"+(back?" back":"")},el,h("div",{class:"shade"}));
  let anim;const ease="cubic-bezier(.45,.05,.25,1)";
  if(st.spread){
    const O=spreadOf(st.p),W=spreadOf(np);
    if(dir>0){
      book.append(mk("l",pageEl(O[0],false)),mk("r",pageEl(W[1],false)));
      leaf.style.left=st.pw+"px";leaf.style.transformOrigin="left center";
      leaf.append(face(pageEl(O[1],false)),face(pageEl(W[0],false),true));book.appendChild(leaf);
      anim=leaf.animate([{transform:"rotateY(0deg)"},{transform:"rotateY(-180deg)"}],{duration:720,easing:ease});
    }else{
      book.append(mk("l",pageEl(W[0],false)),mk("r",pageEl(O[1],false)));
      leaf.style.left="0px";leaf.style.transformOrigin="right center";
      leaf.append(face(pageEl(O[0],false)),face(pageEl(W[1],false),true));book.appendChild(leaf);
      anim=leaf.animate([{transform:"rotateY(0deg)"},{transform:"rotateY(180deg)"}],{duration:720,easing:ease});
    }
  }else{
    leaf.style.left="0px";leaf.style.transformOrigin="left center";
    if(dir>0){
      book.append(mk("",pageEl(np,false)));leaf.append(face(pageEl(st.p,false)));book.appendChild(leaf);
      anim=leaf.animate([{transform:"rotateY(0deg)",opacity:1},{transform:"rotateY(-95deg)",opacity:.2}],{duration:520,easing:ease});
    }else{
      book.append(mk("",pageEl(st.p,false)));leaf.append(face(pageEl(np,false)));book.appendChild(leaf);
      anim=leaf.animate([{transform:"rotateY(-95deg)",opacity:.2},{transform:"rotateY(0deg)",opacity:1}],{duration:520,easing:ease});
    }
  }
  anim.finished.then(finish,finish);
}

// ---------- side arrows / nav ----------
const arrow=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const sidePrev=h("button",{class:"side prev","aria-label":"Faqja e mëparshme"}),sideNext=h("button",{class:"side next","aria-label":"Faqja tjetër"});
sidePrev.innerHTML=arrow("M15 5l-7 7 7 7");sideNext.innerHTML=arrow("M9 5l7 7-7 7");
$("#app").append(sidePrev,sideNext);
function placeSides(){const r=stage.getBoundingClientRect();[sidePrev,sideNext].forEach(b=>{b.style.position="fixed";b.style.top=(r.top+r.height/2)+"px";});}
sidePrev.onclick=prev;sideNext.onclick=next;$("#prevBtn").onclick=prev;$("#nextBtn").onclick=next;

let sw=null;const ptrs=new Map();let pinch=null,lastTap=0;
function relPos(x,y){const r=stage.getBoundingClientRect();return [(stage.scrollLeft+x-r.left)/Math.max(1,stage.scrollWidth),(stage.scrollTop+y-r.top)/Math.max(1,stage.scrollHeight)];}
stage.addEventListener("pointerdown",e=>{
  if(st.tool!=="read"||st.busy)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:st.zoom,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,s:1};sw=null;return;}
  if(e.isPrimary&&st.zoom<=1.01)sw={x:e.clientX,y:e.clientY,t:Date.now(),type:e.pointerType};
  else if(e.isPrimary)sw={x:e.clientX,y:e.clientY,t:Date.now(),type:e.pointerType,noswipe:true};
});
stage.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];pinch.s=Math.hypot(a.x-b.x,a.y-b.y)/pinch.d0;
    const r=book.getBoundingClientRect();book.style.transformOrigin=`${pinch.mx-r.left}px ${pinch.my-r.top}px`;book.style.transform=`scale(${Math.max(.6,Math.min(3.5,pinch.s))})`;}
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(pinch&&ptrs.size<2){const p=pinch;pinch=null;book.style.transform="";const [cx,cy]=relPos(p.mx,p.my);if(Math.abs(p.s-1)>.04)setZoomTo(p.z0*p.s,cx,cy);sw=null;return true;}
  return false;
}
stage.addEventListener("pointerup",e=>{
  if(endPtr(e))return;
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y,dt=Date.now()-sw.t,s0=sw;sw=null;
  if(!s0.noswipe&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4&&dt<700){dx<0?next():prev();return;}
  if(Math.abs(dx)<10&&Math.abs(dy)<10&&dt<300){
    if(s0.type!=="mouse"){
      const now=Date.now();
      if(now-lastTap<320){lastTap=0;const [cx,cy]=relPos(e.clientX,e.clientY);setZoomTo(st.zoom>1.01?1:2,cx,cy);toast(st.zoom>1.01?"Zmadhim 200 % – prek dy herë për ta kthyer":"Zmadhim 100 %");}
      else lastTap=now;
      return;
    }
    if(st.zoom>1.01)return;
    const r=book.getBoundingClientRect();
    if(e.clientY>r.top&&e.clientY<r.bottom){
      if(e.clientX>r.right-r.width*0.12&&e.clientX<r.right)next();
      else if(e.clientX<r.left+r.width*0.12&&e.clientX>r.left)prev();
    }
  }
});
stage.addEventListener("pointercancel",e=>{endPtr(e);sw=null;});
document.addEventListener("keydown",e=>{
  const t=e.target;if(t&&(t.isContentEditable||t.tagName==="INPUT"))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();next();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();prev();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();doUndo();}
  else if(e.key==="Escape")closeDrawer();
});
const pgInput=$("#pgInput");
pgInput.addEventListener("focus",()=>pgInput.select());
pgInput.addEventListener("keydown",e=>{if(e.key==="Enter")pgInput.blur();});
pgInput.addEventListener("change",()=>{const v=pgInput.value.trim().toLowerCase();if(v==="cover"||v==="0"){go(1);return;}const n=parseInt(v,10);if(n>=1&&n<=N-1)go(n+1);else updateNav();});
pgInput.addEventListener("blur",()=>setTimeout(updateNav,0));

// ---------- tools ----------
const tray=$("#tray");
const HINT={pen:"Laps: shkruaj në faqe",hl:"Theksues: shëno fjalët me ngjyrë",text:"Tekst: prek faqen, pastaj shkruaj (edhe arabisht)",erase:"Gomë: kalo mbi vija ose shënime",read:"Lexo: rrëshqit ose përdor shigjetat për të shfletuar"};
function setTool(t,quiet){
  st.tool=t;
  tray.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.tool===t)));
  if(!quiet){
    if(t==="hl"&&st.color==="#1b2a6b")pickColor("#f5b400");
    if(t==="pen"&&st.color==="#f5b400")pickColor(st.mode==="review"?"#d11a5f":"#1b2a6b");
    toast(HINT[t]);render();
  }
}
tray.querySelectorAll("[data-tool]").forEach(b=>b.addEventListener("click",()=>setTool(b.dataset.tool)));
function pickColor(c){st.color=c;tray.querySelectorAll("[data-color]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.color===c)));try{localStorage.setItem("abrar-tool-v1",JSON.stringify({color:c}))}catch(e){}}
tray.querySelectorAll("[data-color]").forEach(b=>b.addEventListener("click",()=>{pickColor(b.dataset.color);if(st.tool==="read")setTool("pen");}));
pickColor(st.color);

function doUndo(){
  const u=undo.pop();if(!u){toast("Nuk ka asgjë për të zhbërë");return;}
  const L=u.L,a=L.page(u.p);
  if(u.k==="s")a.s=a.s.filter(x=>x!==u.item);
  else if(u.k==="n")a.n=a.n.filter(x=>x!==u.item);
  else if(u.k==="us")a.s.splice(Math.min(u.i,a.s.length),0,u.item);
  else if(u.k==="un")a.n.splice(Math.min(u.i,a.n.length),0,u.item);
  else if(u.k==="clear"){a.s=u.item.s;a.n=u.item.n;}
  L.save(u.p);
  if(!visible().includes(u.p))go(u.p);else render();
}
$("#undoBtn").onclick=doUndo;
let clearArm=null;
$("#clearBtn").onclick=()=>{
  const b=$("#clearBtn"),L=editLayer(),v=visible().filter(p=>L.has(p));
  const lbl=b.querySelector("span");
  if(!v.length){toast("Në këtë faqe nuk ka asgjë për të fshirë");return;}
  if(!clearArm){b.classList.add("warn");lbl.textContent="Sicher?";clearArm=setTimeout(()=>{clearArm=null;b.classList.remove("warn");lbl.textContent="Pastro";},3000);return;}
  clearTimeout(clearArm);clearArm=null;b.classList.remove("warn");lbl.textContent="Pastro";
  v.forEach(p=>{const a=L.page(p);undo.push({L,p,k:"clear",item:{s:a.s,n:a.n}});a.s=[];a.n=[];L.save(p);});
  render();toast("Faqja u pastrua – mund ta rikthesh me „Prapa“");
};
function setZoomTo(z,cx,cy){
  z=Math.max(0.75,Math.min(3,z));
  const sx=cx==null?(stage.scrollLeft+stage.clientWidth/2)/Math.max(1,stage.scrollWidth):cx,sy=cy==null?(stage.scrollTop+stage.clientHeight/2)/Math.max(1,stage.scrollHeight):cy;
  st.zoom=z;render();
  stage.scrollLeft=sx*stage.scrollWidth-stage.clientWidth/2;stage.scrollTop=sy*stage.scrollHeight-stage.clientHeight/2;
}
function setZoom(dir){
  const i=ZOOMS.findIndex(z=>Math.abs(z-st.zoom)<.01),ni=Math.max(0,Math.min(ZOOMS.length-1,i+dir));
  if(ni===i)return;
  const cx=(stage.scrollLeft+stage.clientWidth/2)/Math.max(1,stage.scrollWidth),cy=(stage.scrollTop+stage.clientHeight/2)/Math.max(1,stage.scrollHeight);
  st.zoom=ZOOMS[ni];render();
  stage.scrollLeft=cx*stage.scrollWidth-stage.clientWidth/2;stage.scrollTop=cy*stage.scrollHeight-stage.clientHeight/2;
}
$("#zoomIn").onclick=()=>setZoom(1);$("#zoomOut").onclick=()=>setZoom(-1);

// ---------- drawer ----------
let tab="toc",pgFilter="all";
const drawer=$("#drawer"),scrim=$("#scrim"),dbody=$("#dbody");
const TABS={toc:"#tabToc",pages:"#tabPages",tasks:"#tabTasks",class:"#tabClass"};
function openDrawer(t){if(t)selTab(t,true);drawer.hidden=false;scrim.hidden=false;fillDrawer();const c=dbody.querySelector(".cur");if(c)c.scrollIntoView({block:"center"});}
function closeDrawer(){drawer.hidden=true;scrim.hidden=true;}
function selTab(t,noFill){tab=t;for(const k in TABS)$(TABS[k]).setAttribute("aria-selected",String(k===t));if(!noFill)fillDrawer();}
for(const k in TABS)$(TABS[k]).onclick=()=>selTab(k);
$("#tocBtn").onclick=()=>openDrawer();$("#closeDrawer").onclick=closeDrawer;scrim.onclick=closeDrawer;
function refreshDrawer(){if(!drawer.hidden){const a=document.activeElement;if(a&&drawer.contains(a)&&a.tagName==="INPUT")return;const y=dbody.scrollTop;fillDrawer();dbody.scrollTop=y;}}
const jump=p=>{closeDrawer();go(p);};
const fmtDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("sq-AL",{weekday:"short",day:"numeric",month:"short"});}catch(e){return d;}};
function ago(t){if(!t)return"noch nie";const m=Math.round((Date.now()-t)/60000);if(m<2)return"gerade eben";if(m<60)return"vor "+m+" Min.";const hh=Math.round(m/60);if(hh<24)return"vor "+hh+" Std.";const d=Math.round(hh/24);return d===1?"gestern":"vor "+d+" Tagen";}
function fillDrawer(){
  dbody.innerHTML="";
  if(tab==="toc")return fillToc();
  if(tab==="pages")return fillPages();
  if(tab==="tasks")return fillTasks();
  if(tab==="class")return fillClass();
}
function fillToc(){
  let cc=0;CH.forEach((x,i)=>{if(x[1]<=visible()[0])cc=i;});
  dbody.append(h("ul",{class:"toc"},CH.map(([t,p,ex],i)=>h("li",null,h("button",{class:(ex?"ex ":"")+(i===cc?"cur":""),onclick:()=>jump(p)},h("span",{text:t}),h("small",{text:label(p)}))))));
}
function fillPages(){
  const W=st.mode==="review"?revWork:mine,F=st.mode==="review"?revFb:myFb;
  const lbl=st.mode==="review"?"Me punë të nxënësit":"Mit Notizen";
  dbody.append(h("div",{class:"chips"},
    h("button",{"aria-pressed":String(pgFilter==="all"),onclick:()=>{pgFilter="all";fillDrawer();}},"Alle"),
    h("button",{"aria-pressed":String(pgFilter==="mine"),onclick:()=>{pgFilter="mine";fillDrawer();}},lbl),
    (role.online?h("button",{"aria-pressed":String(pgFilter==="fb"),onclick:()=>{pgFilter="fb";fillDrawer();}},"Korrigiert"):null)));
  let list=Array.from({length:N},(_,i)=>i+1);
  if(pgFilter==="mine")list=list.filter(p=>W.has(p));
  if(pgFilter==="fb")list=list.filter(p=>F.any(p));
  if(!list.length){dbody.append(h("p",{class:"empty",text:pgFilter==="fb"?"Hier erscheinen Seiten, sobald sie korrigiert wurden.":"Ende pa shënime. Zgjidh poshtë lapsin, theksuesin ose tekstin dhe shkruaj direkt në libër."}));return;}
  const v=visible();
  dbody.append(h("div",{class:"grid"},list.map(p=>{
    const im=new Image();im.loading="lazy";im.src=src(p);im.alt="";
    const b=h("button",{class:"th"+(v.includes(p)?" cur":""),onclick:()=>jump(p)},im,h("span",{text:p===1?"Cover":"S. "+label(p)}));
    if(W.has(p))b.append(h("i",{class:"dot",title:"Mit Notizen"}));
    const f=F.d[p];if(f&&f.st)b.append(h("span",{class:"stt "+f.st,text:f.st==="ok"?"✓":"↺"}));
    return b;
  })));
}
function rangeStats(F,t){let ok=0,redo=0;for(let p=(+t.from)+1;p<=(+t.to)+1;p++){const f=F.d[p];if(f&&f.st==="ok")ok++;if(f&&f.st==="redo")redo++;}return {ok,redo};}
function fillTasks(){
  if(role.owner){
    const ti=h("input",{id:"t-title",placeholder:"p.sh. ushtro fethanë",maxlength:"80"}),fr=h("input",{id:"t-from",inputmode:"numeric",placeholder:"15"}),to=h("input",{id:"t-to",inputmode:"numeric",placeholder:"18"}),due=h("input",{id:"t-due",type:"date"});
    const add=async()=>{
      const a=parseInt(fr.value,10),b=parseInt(to.value||fr.value,10);
      if(!ti.value.trim()){toast("Bitte einen Titel eingeben");ti.focus();return;}
      if(!(a>=1&&a<=N-1)||!(b>=a&&b<=N-1)){toast("Faqe ndërmjet 1 dhe "+(N-1)+" eingeben");fr.focus();return;}
      try{await role.db.collection("tasks").add({t:ti.value.trim(),from:a,to:b,due:due.value||"",u:Date.now()});toast("Aufgabe gespeichert");ti.value="";fr.value="";to.value="";due.value="";}
      catch(e){toast("Speichern hat nicht geklappt – bitte nochmal versuchen");}
    };
    dbody.append(h("div",{class:"form"},
      h("label",{class:"full"},"Detyrë e re shtëpie",ti),h("label",null,"Nga faqja",fr),h("label",null,"Deri te faqja",to),
      h("label",{class:"full"},"Afati",due),h("button",{class:"btn",style:"grid-column:1/-1",onclick:add},"Jep detyrën")));
  }
  if(!tasks.length){dbody.append(h("p",{class:"empty",text:role.owner?"Noch keine Aufgaben. Vergib oben die erste – deine Schüler sehen sie sofort.":"Ende pa detyra nga mësuesi yt."}));}
  const sids=Object.keys(students);
  tasks.forEach(t=>{
    const card=h("div",{class:"card"},h("h3",{text:t.t||"Aufgabe"}));
    const m=h("div",{class:"meta"},h("button",{class:"lnk",onclick:()=>jump((+t.from)+1)},"Faqja "+t.from+(t.to&&t.to!=t.from?"–"+t.to:"")));
    if(t.due)m.append(h("span",{text:"afati "+fmtDate(t.due)}));
    card.append(m);
    if(role.owner){
      const n=sids.filter(s=>students[s].done&&students[s].done[t.id]).length;
      const del=h("button",{class:"btn ghost"},"Fshi");let arm=null;
      del.onclick=async()=>{if(!arm){del.textContent="Vërtet ta fshij?";arm=setTimeout(()=>{arm=null;del.textContent="Fshi";},3000);return;}clearTimeout(arm);try{await role.db.doc("tasks/"+t.id).delete();toast("Detyra u fshi");}catch(e){toast("Fshirja nuk funksionoi");}};
      card.append(h("div",{class:"row"},h("span",{class:"badge calm",text:n+" nga "+sids.length+" erledigt"}),del));
    }else{
      const cb=h("input",{type:"checkbox",id:"done-"+t.id});cb.checked=!!meta.done[t.id];
      cb.onchange=()=>{if(cb.checked)meta.done[t.id]=Date.now();else delete meta.done[t.id];q.put(`hw/${role.id}`,metaBody);toast(cb.checked?"U dorëzua – mësuesi yt e sheh":"Dorëzimi u tërhoq");};
      const s=rangeStats(myFb,t);
      const row=h("div",{class:"row"},h("label",{class:"chk"},cb,"Erledigt & abgegeben"));
      if(s.ok)row.append(h("span",{class:"pill ok on",text:"✓ "+s.ok}));
      if(s.redo)row.append(h("span",{class:"pill redo on",text:"↺ "+s.redo}));
      card.append(row);
    }
    dbody.append(card);
  });
  if(role.online&&!role.owner){
    const nk=h("input",{id:"nick",placeholder:"Emri dhe mbiemri",maxlength:"40",value:meta.nick||""});
    nk.addEventListener("change",()=>{meta.nick=nk.value.trim();q.put(`hw/${role.id}`,metaBody);toast("Emri u ruajt");});
    dbody.append(h("div",{class:"form"},h("label",{class:"full"},"Emri yt për mësuesin",nk)));
  }
}
function fillClass(){
  const sids=Object.keys(students).sort((a,b)=>(students[b].u||0)-(students[a].u||0));
  dbody.append(h("p",{class:"hint",text:"Tippe auf einen Schüler, um seine Seiten zu sehen und mit Pink zu korrigieren. Seine Notizen erscheinen live."}));
  if(!sids.length){dbody.append(h("p",{class:"empty",text:"Noch keine Schüler. Teile das Buch über „Teilen“ mit deinen Schülern. Sobald sie etwas schreiben, erscheinen sie hier."}));return;}
  if(st.mode==="review")dbody.append(h("div",{class:"row",style:"padding:0 6px 10px"},h("button",{class:"btn ghost",onclick:()=>{closeDrawer();exitReview();}},"Kthehu te libri im")));
  const list=h("div");dbody.append(list);
  const rows={};
  sids.forEach(sid=>{
    const s=students[sid],pu=s.pu||{},F=fbU[sid]||{};
    const todo=Object.keys(pu).filter(p=>!(F[p]>=pu[p])).length;
    const done=tasks.filter(t=>s.done&&s.done[t.id]).length;
    const img=h("img",{alt:""}),nm=h("b",{text:s.nick||"Nxënësi"});
    const sub=ago(s.u)+" · "+(s.n||0)+" Seiten"+(tasks.length?" · "+done+"/"+tasks.length+" Aufgaben":"");
    const b=h("button",{class:"stu"+(st.rev===sid?" cur":""),onclick:()=>{closeDrawer();enterReview(sid);}},img,h("span",null,nm,h("small",{text:sub})),todo?h("span",{class:"badge",text:todo+" neu"}):h("span",{class:"badge calm",text:"✓"}));
    rows[sid]={img,nm};list.append(b);
  });
  names(sids).then(ps=>{sids.forEach(sid=>{const r=rows[sid];if(!r)return;r.nm.textContent=ps[sid].label;if(ps[sid].avatarUrl)r.img.src=ps[sid].avatarUrl;});});
}

// ---------- misc ----------
let toastT=null;
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400);}
function fromHash(){const m=/^#seite-(\d+)$/.exec(location.hash);if(m){const n=+m[1]+1;if(n>=1&&n<=N)st.p=n;}}
window.addEventListener("hashchange",()=>{const o=st.p;fromHash();if(st.p!==o){const p=st.p;st.p=o;go(p);}});
let rt=null;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!st.busy&&!st.drawing)render();placeSides();},120);});
fromHash();render();placeSides();
try{if(matchMedia("(pointer:coarse)").matches&&!localStorage.getItem("abrar-hint-v1")){setTimeout(()=>toast("Rrëshqit për të shfletuar · dy gishta ose prekje e dyfishtë për zmadhim"),700);localStorage.setItem("abrar-hint-v1","1");}}catch(e){}
})();

</script>
